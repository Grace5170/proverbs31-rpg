.page{max-width:980px;min-height:100vh;margin:0 auto;background:var(--paper);box-shadow:0 0 65px #182c241e;display:flex;flex-direction:column}.mast{background:linear-gradient(128deg,#1d352d 0%,#2e4c3b 52%,#20382f 100%);color:#f8f4ea;padding:17px clamp(20px,5vw,56px);border-bottom:4px solid #ae9261;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;letter-spacing:.12em;text-transform:uppercase;font-size:11px;font-weight:700}.brand .seal{border:1px solid #d7c8a2;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font:24px Georgia,serif;color:#e4cfa6}.mast-actions{display:flex;gap:7px;flex-wrap:wrap}.ghost{color:#f8f4ea;background:transparent;border:1px solid #779084;border-radius:999px;padding:7px 12px;font-size:12px}.ghost:hover{background:#ffffff1a}.container{width:100%;max-width:800px;margin:0 auto;padding:clamp(22px,5vw,55px) clamp(18px,4vw,32px) 50px;flex:1}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:750}.lead{font:clamp(34px,6vw,59px)/1.09 Georgia,'Times New Roman',serif;letter-spacing:-.04em;margin:12px 0 20px;color:var(--deep)}.subtitle{font:italic 18px/1.5 Georgia,serif;color:#5f7465}.line{height:1px;background:var(--line);margin:23px 0}.intro{max-width:680px;margin:26px auto 34px}.prose p{font:19px/1.82 Georgia,'Times New Roman',serif;color:#2a3831;margin:0 0 1.28em}.prose strong{color:#253e35}.prose em{color:#4e6558}.prose p:first-child::first-letter{font-size:1.23em}.route-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:28px 0}.route-card{display:block;text-align:left;background:#fffdf7;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:5px;padding:20px 18px;min-height:245px;box-shadow:0 7px 18px #1a31240b;transition:transform .15s,box-shadow .15s}.route-card:hover{transform:translateY(-3px);box-shadow:0 10px 22px #1a312421}.route-num{font:31px Georgia,serif;color:var(--accent)}.route-card h3{font:23px/1.18 Georgia,serif;margin:11px 0}.route-card p{font-size:13px;color:#647267;line-height:1.55}.route-card .small{font-size:12px;font-weight:650;color:var(--accent)}.field{margin:12px 0 18px}.field label,.field-label{display:block;font-size:12px;letter-spacing:.09em;font-weight:700;text-transform:uppercase;color:#56695c;margin-bottom:6px}.input,textarea{width:100%;border:1px solid #c7c3b6;border-radius:5px;background:#fffefa;padding:11px 13px;color:var(--ink);font-size:15px}textarea{min-height:105px;resize:vertical}.toprow{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px;flex-wrap:wrap}.progress{height:5px;background:#e1dccf;border-radius:99px;overflow:hidden;margin:8px 0 30px}.progress>div{height:100%;background:#9f8258;transition:width .2s}.scene-title{font:clamp(36px,6vw,54px)/1.15 Georgia,serif;letter-spacing:-.035em;margin:8px 0 12px}.scene-meta{color:var(--muted);font-size:13px}.scene-kicker{font:italic 19px Georgia,serif;color:#6a766c;margin:8px 0 30px}.scene-divider{max-width:250px;margin:28px auto;text-align:center;color:#a28b65;letter-spacing:10px}.inset{padding:16px 19px;border-left:3px solid #ab926a;background:#f1ebdf;margin:20px 0;font-size:14px;color:#47584c}.choice-box{border:1px solid #d9d0bf;padding:20px;border-radius:6px;background:#f1ede4;margin:30px 0}.choice-title{font:25px Georgia,serif;margin:0 0 15px}.choice{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:#fffdf8;border:1px solid #d4c9b7;border-radius:5px;margin:9px 0;padding:14px 15px;color:var(--ink);transition:border .15s,background .15s}.choice:hover,.choice.selected{border-color:#937854;background:#fff7e8}.choice-index{flex:0 0 24px;border:1px solid #c6b79d;border-radius:50%;display:grid;place-items:center;width:24px;height:24px;font-size:12px;color:#806a51}.choice.selected .choice-index{background:#89724d;color:white;border-color:#89724d}.answer{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}.answer-label{font-size:11px;color:#8b7350;text-transform:uppercase;letter-spacing:.17em;font-weight:bold}.answer p{font:18px/1.8 Georgia,serif}.after{margin-top:26px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.primary{border:0;background:var(--deep);color:#f9f5e9;border-radius:5px;padding:13px 20px;font-weight:650}.primary:hover{background:#314a3c}.secondary{border:1px solid #b8aa92;background:#fffcf5;color:var(--ink);border-radius:5px;padding:12px 17px;font-weight:600}.secondary:hover{background:#eee5d5}.tiny{font-size:12px;color:var(--muted)}.mobile-meta{font-size:12px;color:#68796e}.case-items{margin:18px 0}.case-item{padding:13px 0;border-bottom:1px solid var(--line)}.case-item h4{font:19px Georgia,serif;margin:0 0 4px}.case-item p{margin:0 0 8px;font-size:14px}.choice-history{background:#f1ebdf;padding:10px 14px;margin-top:8px;border-radius:4px;font-size:13px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px}.tag{border-radius:999px;border:1px solid #dbcbb5;background:#f8f1e5;padding:3px 9px;font-size:11px;color:#6c5a40}.ending-ornament{height:165px;background:linear-gradient(135deg,#1d342d,#5e6350 60%,#8d7858);border-radius:4px;display:grid;place-items:center;color:#f7f0df;letter-spacing:.2em;font:italic 27px Georgia,serif;text-align:center;padding:18px;margin-bottom:30px}.ending-ornament.eye{background:linear-gradient(135deg,#243f46,#536c72,#99846c)}.ending-ornament.heart{background:linear-gradient(135deg,#4e343e,#90656c,#b2947c)}.section-head{font:28px Georgia,serif;margin:28px 0 6px}.footer{background:#f0e9de;padding:16px;text-align:center;font-size:11px;color:#67776b;border-top:1px solid #dfd5c4}.alert{background:#e9ede8;border:1px solid #c1d0c2;color:#395444;padding:13px 15px;border-radius:5px;font-size:14px}.quote{font:italic 21px/1.6 Georgia,serif;padding:17px 22px;border-left:3px solid #ab926a;background:#f5eee2;margin:23px 0}.save-indicator{font-size:12px;color:#6b806c}.empty{font:italic 16px Georgia,serif;color:#68786b}.hold{letter-spacing:.1em;color:var(--gold);font-size:11px;text-transform:uppercase;font-weight:700}.envelope-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.envelope{border:1px solid var(--line);background:#f5f1e8;padding:13px;border-radius:5px}.envelope input{max-width:100%}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

</style></head><body><div id="app"></div><script>
'use strict';
const BOOK = {"title":"The House of Wisdom","version":"Week One · Story Bible v1.4","dates":"28 September – 4 October 2026","prologue":"Monday, 28 September 2026. The train slows as Willowmere comes into view: wet slate roofs, a clock tower with a stopped hand, and beyond the rooftops a mansion whose lit windows resemble a ship above a dark sea of trees.\n\nYou have accepted a twelve-week placement with the House of Wisdom Community Renewal Fellowship. An independent committee approved your application. Your role is practical, not ceremonial: listen to the people who use the cooperative, understand what keeps it running, and submit a report its trustees can actually use. Nobody has given you the authority to investigate private lives or settle an estate.\n\nAt the station, a volunteer named Mrs. Finch presses a thick envelope into your hand. “Eleanor had these prepared while she was ill,” she says. “The committee checked the practical arrangements. The letters are hers.” She takes care to say it without reverence, as though reverence has become a dangerous currency in this town.\n\nInside are a simple village map, the terms of your placement, and a note written in a firm, slanting hand: *A woman who listens must also learn when to speak. A woman who sees must ask what she has failed to notice. A woman who builds must know what—and whom—she is building for.*\n\nAcross the street, two women break off an argument when they see your envelope. One turns away. The other watches you until the station clock strikes again, despite its unmoving hands.\n\nThree placements are available. You may serve the people, examine the records, or help rescue the enterprise. Each is a complete way into the story. Choose the work that calls to you.","routes":{"heart":{"name":"The Listening Heart","tag":"A family mystery told through trust, silence, and costly compassion","role":"Community liaison","mark":"I","tone":"A promise kept from a daughter","color":"#874e56"},"eye":{"name":"The Watchful Eye","tag":"An investigative suspense story of ledgers, permissions, and impossible signatures","role":"Records & governance assistant","mark":"II","tone":"A record altered after approval","color":"#3e6570"},"steward":{"name":"The Wise Steward","tag":"A high-stakes story of workers, rescue plans, and property no one may sell","role":"Enterprise development fellow","mark":"III","tone":"A price paid for the wrong property","color":"#7f643a"}},"scenes":{"heart":[{"id":"L1","title":"The Woman at the Window","day":"Mon · Sep 28","place":"Mallow & Thyme Tearoom","hook":"A warning has a human face.","opening":"The tearoom smells of baked apples and rain-soaked wool. The proprietor, Mrs. Finch’s sister, directs you to a small table beneath a stained-glass window. Before you have unfolded the fellowship papers, a woman at the next table notices the brass House of Wisdom seal pressed into your envelope.\n\n“Another one,” she says, so quietly you almost mistake the words for the scrape of a chair. She is in her thirties, with copper hair pinned up without care and ink on the side of her thumb. She has been mending the binding of an old recipe book; thread runs across her knuckles like a set of deliberate lines.\n\n“You must be the fellow.” She does not offer a hand. “Rose Bell. If you have come to write a nice little report about Mrs. Ashford’s generosity, they will give you everything you need. Except the truth.”\n\nThrough the window you can see the clock tower. Its stopped hand points to eleven. Rose notices your glance and gives a brief, humorless smile. “It has been broken for six months. They keep promising to repair it. That is a Willowmere specialty: promising things in public.”","turn":"The owner brings tea before either of you orders it. “Rose,” she warns gently, “let our guest sit down.” Rose runs a finger over the frayed recipe-book spine and then looks unexpectedly embarrassed.\n\n“My mother used to repair the books in that workshop,” she says. “She taught apprentices who couldn't afford a needle. They used her recipes for the community suppers, too. Eleanor got the photographs, the speeches, and the portrait in the gallery. My mother got her name dragged through the market.”\n\nA young girl enters to deliver an envelope for Rose. Rose kneels to thank her, and her face changes completely: open, patient, almost radiant. The girl races away. That small tenderness makes Rose's anger harder to dismiss as bitterness.","pressure":"“My mother is Clara Bell. Ask anyone what she did and see how quickly they answer. Then ask what they actually saw.” Rose slides the recipe book toward you. Inside the cover someone has written: *If you cannot feed everybody, begin with the person in front of you.*\n\nRose does not demand that you agree with her. She asks something more unsettling. “When they tell you my mother confessed, will you ask what she confessed to?” She waits. Outside, the late bus passes the window, sending a veil of water across the glass.","question":"How do you respond to Rose?","choices":[{"label":"Ask what Rose personally knows","response":"“Tell me what you remember yourself,” you say. “Not what people told you afterward.” Rose looks at you for a long moment. “I was four when the scandal broke,” she answers. “I remember my mother standing by the sink, washing the same cup until her hands were red. I cannot prove what she feared. I can tell you she was never a thief.” She closes the recipe book, carefully this time. “That is where we can start.”","later":"Rose will later distinguish memories from rumors in Week 3.","effects":{"RoseTrust":2,"EvidenceIntegrity":1}},{"label":"Defend Eleanor’s good work","response":"“The cooperative has helped people,” you say. “That must count for something.” Rose’s expression tightens. “Of course it counts. That’s why the truth matters.” She pushes back her chair, then pauses. “My mother sewed winter coats for women who couldn't pay. Those are not competing facts.” Rose leaves her untouched tea, but not before writing Clara's name and an address on a scrap of paper. “If you genuinely want to understand, begin there.”","later":"Rose will challenge your assumptions before offering personal testimony.","effects":{"RoseTrust":-1,"CatherineTrust":1}},{"label":"Admit that you do not yet know","response":"“I wasn't here,” you answer. “It would be dishonest to pretend I understand what happened.” Rose's shoulders lower. “That may be the first useful answer I've heard from anyone holding that envelope.” She tells you her mother can be stubborn, and that she herself is no easier. Then she circles the word *confessed* on an old newspaper clipping. “Begin with what that word actually meant.”","later":"Rose remembers that you resisted taking sides without evidence.","effects":{"RoseTrust":1,"EvidenceIntegrity":2}}],"closing":"When Rose leaves, the proprietor gathers the cups. “She's angry because she remembers what was lost,” she says. “That doesn't mean she knows everything. None of us do.”\n\nYou look at the clipping Rose left behind. Under a blurred photograph of the workshop, a headline declares **BOOKKEEPER ADMITS RESPONSIBILITY**. The article never quotes the statement in full. You fold it into your casebook. It is not proof of innocence, nor proof of guilt. It is a question someone once stopped asking.\n\nYour fellowship begins tomorrow. Already, there is a person behind the name in the official reports.","evidence":["Clara’s published “confession” is summarized, not quoted in full.","Rose remembers the scandal at age four; her recollections require corroboration."],"echo":[]},{"id":"L2","title":"The Empty Chair","day":"Tue · Sep 29","place":"St. Anne’s Community Hall","hook":"One name on a card can reopen an old wound.","opening":"A long table has been laid for the monthly community supper committee. Seven places are filled; an eighth is marked **CLARA BELL** in ink so fresh that it has left a small pool at the base of the letters. Catherine Ashford stands at the far end arranging envelopes into exact piles, beautiful in a charcoal dress that seems chosen for armor rather than fashion.\n\n“Mrs. Bell was invited,” Catherine says when Rose asks about the empty place. “The invitation went out with every other letter.”\n\n“Did you send it to the house where she lives?” Rose asks. The room goes very still. Catherine consults a printed list. “To Mrs. Clara Pike, on Market Row.”\n\n“My mother's name has been Bell for twenty years. She's lived on Orchard Lane for twelve.” Rose's voice is controlled, but you can hear the effort. Catherine looks as though someone has struck a nerve she has kept bandaged for years. “Then the list is wrong,” she says.","turn":"You spend the next hour with volunteers arranging donated bowls, chairs and a noticeboard for the coming harvest meal. Catherine carries the heaviest boxes herself. Twice she asks for your opinion about accessibility for older residents; she listens closely and changes the plan. She is not indifferent to the town. She is simply less capable of saying sorry than of lifting furniture.\n\nMrs. Finch shows you the mailing sheet. The address was copied from an old donor directory compiled before Clara returned to the name Bell, then imported into a newer database without verification. Nothing suggests deliberate interception. “I should have checked,” Catherine says, looking at the page. “I knew there had been changes.”\n\nRose replies, “You knew the letter mattered.” Catherine meets her eyes. “Yes.” The admission is small, but it costs her something.","pressure":"The community hall is a place for practical solutions, yet everyone seems to be waiting for a verdict. Rose wants Clara treated with dignity. Catherine wants to correct the error without turning a public meeting into a trial of Eleanor's legacy. Mrs. Finch looks to you—not because you have authority, but because you have not yet made enemies here.\n\nThe invitation itself is still sealed in the office, returned with an undeliverable stamp. No conspiracy is required to hurt someone; carelessness can accomplish enough on its own.","question":"What do you offer to do?","choices":[{"label":"Ask Clara whether she would welcome a new invitation","response":"You offer to contact Clara only after Rose confirms her mother wishes to hear from the committee. Catherine nods. “A fresh letter, with her correct name, and an apology from me.” Rose studies her as if she had not expected those words. She does not smile, but she places the new envelope into her bag without crumpling it.","later":"Clara may be willing to speak independently in Week 4.","effects":{"ClaraConsent":2,"RoseTrust":1}},{"label":"Ask Catherine to make the apology herself","response":"“It should come from the person responsible for the list,” you say. Catherine's cheeks flush. Then she takes out a pen. “You're right. I shall write it.” Rose watches her put down *Dear Mrs. Bell* rather than the more distant *Dear Madam*. “Don't make it grand,” Rose says. “Make it true.”","later":"Catherine is more willing to acknowledge practical errors openly.","effects":{"CatherineTrust":1,"ClaraConsent":1}},{"label":"Fix the mailing process for everyone","response":"You suggest that the committee invite all members to check their contact details, rather than singling Clara out as a problem to be repaired. Mrs. Finch immediately approves. Catherine asks for a simple confirmation form that doesn't require anyone to explain why a name changed. Rose mutters, “For once, an improvement that might outlive the meeting.”","later":"The community notices that you solve systems, not just arguments.","effects":{"WorkerTrust":1,"RoseTrust":1,"CatherineTrust":1}}],"closing":"After the room empties, Catherine stands beside the unused place setting. “I knew Mrs. Bell once,” she says, not looking at you. “Long before the scandal. I remember the sound of her humming when she worked.”\n\n“Then why does Rose think you never knew her?” you ask.\n\nCatherine straightens the empty chair. “Because I have not told Rose everything.” She turns away before you can decide whether the admission was a warning or a plea.\n\nYou record the mailing error accurately. It explains one wound. It does not explain the weight of Catherine’s final words.","evidence":["Clara’s missing invitation was a contact-record error, not evidence of sabotage.","Catherine remembers Clara from childhood and admits withholding context."],"echo":["Rose sends a brief note: ‘Thank you for asking what I knew, not what people say I knew.’","Rose answers your greeting politely, but the easy conversation you hoped for does not come.","Rose remembers your caution: ‘You didn’t make me prove my mother’s pain at the table.’"]},{"id":"L3","title":"The Letter Never Sent","day":"Wed · Sep 30","place":"Rose’s bookbinding workroom","hook":"A promise written in ink survives thirty years.","opening":"Rose's workshop occupies the back of her narrow terrace. Books hang in presses like small sleeping animals. The shelves hold paper, thread, gilded labels, and a chipped blue cup filled with sharpened pencils. She lets you inside only after you promise that nothing she shows you will enter the fellowship report without her permission.\n\n“Some people think a report is a kind of pardon,” she says. “If you put a fact in the right column, you think you have done the right thing.” Then she clears space beside a ledger and sets down an envelope yellowed at its edges.\n\nIt bears Eleanor's name and the words **NOT SENT** in Clara's handwriting. The letter was found among Clara's papers after a recent move. Rose has read it often enough that the folds are beginning to split.\n\nThe opening concerns ordinary things: Catherine's school examinations, the vegetables planted behind Eleanor's conservatory, a winter coat Clara made but never delivered. Then the handwriting changes pressure.","turn":"“Listen to this.” Rose reads: “You promised that when she was old enough, she would be allowed to know—” The sentence stops where the page has torn. A second sheet may once have been attached. There is no date at the bottom, only a faint impression from another page.\n\nRose lowers the letter. “My mother says she was writing about wages and opportunities she was promised when I grew up. But why say *she*? Why not use my name?” Her voice turns quiet. “And why was Eleanor saving my childhood things?”\n\nYou resist the urge to supply a tidy theory. The ink on the edge shows no sign of fresh tampering, but the fragment alone cannot identify the subject. Rose has every reason to see herself in the missing words; she has lived with the injury all her life.","pressure":"A knock at the front door interrupts you. It is Daniel Mercer, bringing a repaired frame Rose commissioned for a charity raffle. He moves through the small room with careful consideration, leaving his muddy boots by the threshold. He notices the old envelope and immediately looks away.\n\n“My uncle worked with Eleanor,” he says, when Rose introduces him. “People assume that means I know all the answers. I mostly know where the roof leaks.” Rose laughs despite herself. The laugh dies when he mentions that the heritage gallery is being closed for maintenance this afternoon.\n\nThe room suddenly seems full of possible connections. But a personal letter is not public evidence simply because it might contain a clue.","question":"What should happen to Clara’s letter?","choices":[{"label":"Ask Rose for permission to make a careful transcript","response":"“Only the lines you are willing to share,” you say. Rose reads the passage again while you write the words and note precisely where the paper is torn. You do not photograph the envelope. “Thank you,” she says. “It's surprising how different it feels when someone asks.”","later":"Rose may entrust you with a second fragment in Week 5.","effects":{"RoseTrust":2,"ClaraConsent":1,"EvidenceIntegrity":1}},{"label":"Suggest asking Clara what she intended","response":"“She is the one person who can tell us what she meant,” you say. Rose winds the loose thread back onto a spool. “I am afraid she'll say nothing. But you're right that I shouldn't decide what her words mean for her.” She sets the letter beside her mother's address and resolves to ask when Clara feels ready.","later":"Clara remains in control of explaining her own words.","effects":{"ClaraConsent":2,"RoseTrust":1}},{"label":"Recommend comparing the fragment with other letters","response":"You suggest looking for a date or a matching page in letters Rose is already entitled to inspect. “You mean we can't build a theory on half a sentence,” she says. “An irritatingly sensible point.” You help her make a list, leaving the original where she can keep it safe.","later":"An archival paper trail becomes available earlier.","effects":{"EvidenceIntegrity":2,"RoseTrust":0}}],"closing":"Before you leave, Rose shows you an old society newsletter, preserved between two sheets of tissue paper. On its back page is a tiny photograph of Eleanor with several workshop staff. One woman's face has been cropped by the layout. Rose taps the space where the image ends.\n\n“They always left somebody out,” she says. Her finger rests not on Eleanor, but on the empty edge of the picture.\n\nAcross town the gallery is closed for maintenance, another ordinary fact that will soon become difficult to explain. All you know is that a torn sentence has made one woman's certainty tremble.","evidence":["Clara’s unfinished letter refers to an unnamed girl and a promise by Eleanor.","The letter is a private family document, not automatically available for public reporting."],"echo":[]},{"id":"L4","title":"Catherine’s Silence","day":"Thu · Oct 1","place":"Ashford House Conservatory","hook":"Some secrets are not yours to reveal.","opening":"The conservatory smells of citrus leaves and damp stone. Catherine meets you beside an orange tree whose branches have been trained against the glass. She has invited you to discuss community meal access; she does not know Rose has shown you a letter.\n\nCatherine listens as you describe the contact-list problem and the embarrassment it caused. “I have asked Mrs. Finch to correct the entire database,” she says. “Not because it is elegant but because nobody should have to explain an old hurt to receive a supper invitation.” She pauses. “You were right to insist we do better.”\n\nWhen you mention Clara's name, Catherine's hand closes around the handle of her cup. There is no outward drama—only a slight shift in the way she stands, as though the room has lost a degree of warmth.","turn":"“I visited the family archive this morning,” she says. “Not the heritage gallery. Eleanor kept two worlds apart: the one she showed the town and the one she put in boxes.” From a pocket she takes an old brass key. “I had permission to look at the family papers. There are things I wish I had asked her when she could still answer.”\n\nYou ask nothing about the contents. Catherine seems almost disappointed, then relieved. She gestures toward a photograph on the mantel: Eleanor laughing at a village fête, young Catherine at her side, and a space between them where someone has been cut from the picture by the photographer's framing.\n\n“People here make a saint of her,” Catherine says. “Others make a monster. I loved her. I did not always understand her. That isn't an answer to everything she did.”","pressure":"A bell sounds in the corridor. Margaret Wren enters long enough to confirm the conservatory repairs. She remembers which glass pane leaks and which elderly volunteer needs a step-free route. Catherine thanks her warmly. Margaret notices the brass key but says nothing. She gives you a precise time for tomorrow's volunteer meeting, then goes away.\n\nOnly after the door shuts does Catherine ask whether Rose has been speaking to you. “She has every reason to be angry,” Catherine says. “But there is a conversation that belongs to three women. Eleanor kept us from it for far too long.” She will not tell you which three.","question":"How do you respond to Catherine’s boundary?","choices":[{"label":"Respect the boundary and offer a listening ear","response":"“You don't owe me a family confession,” you say. “If there is something you want the fellowship to understand about its impact, I will listen.” Catherine breathes out. “That is a generous distinction.” For a moment the formidable director looks tired enough to lean on the orange tree. “I may take you up on it.”","later":"Catherine may voluntarily share a memory in Week 7.","effects":{"CatherineTrust":2,"ClaraConsent":1}},{"label":"Ask why Rose cannot be told now","response":"“If Rose is involved, doesn't she deserve the truth?” you ask. Catherine meets your eyes. “Yes. She does. But there is a difference between deserving to know and having a stranger announce it at a public meeting.” Her reply is firmer than before. She does not end the conversation, but she will be more careful with what she says to you.","later":"Catherine remembers your urgency; the family meeting becomes more delicate.","effects":{"CatherineTrust":-1,"RoseTrust":1}},{"label":"Ask what can be documented without breaking confidence","response":"“What may I record?” you ask. Catherine thinks. “That Eleanor's private history affected people still living here, and that they must be allowed to speak for themselves.” She chooses the words deliberately while you write them down. “Not what you think the secret is.”","later":"Your fellowship report is treated as more trustworthy by the board.","effects":{"EvidenceIntegrity":2,"CatherineTrust":1}}],"closing":"As you rise to leave, Catherine glances at the key in her palm. “My mother used to say that locks were for protecting what matters,” she says, and then stops. “Eleanor used to say it,” she corrects herself.\n\nIt is a tiny stumble. You could make a theory of it. Instead, you remember Rose at the tearoom, asking you to distinguish what was seen from what was repeated.\n\nOutside, Margaret is speaking kindly to an elderly gardener about his aching knee. Nothing in her manner suggests that she removed a photograph from the heritage gallery yesterday. Your work is to pay attention, not to pretend attention is proof.","evidence":["Catherine visited the separate family archive Thursday with permission.","Catherine confirms Eleanor’s personal history harmed living people, but sets a privacy boundary."],"echo":["Rose has already given permission for a narrow transcript; you carry only the authorized words.","You have decided Clara must be allowed to explain her own letter; Catherine's caution sounds less like evasion.","Your notes contain questions about dates and authorship, not a claim about the letter's missing page."]},{"id":"L5","title":"A Kindness Misunderstood","day":"Fri · Oct 2","place":"St. Anne’s Harvest Supper","hook":"Kindness is easy until the people you care about disagree.","opening":"Steam clouds the kitchen windows. Volunteers carry trays of baked squash and bread into the community hall while a local school choir wrestles cheerfully with a melody. You take on the unglamorous work: checking which chairs need sturdy arms, finding vegetarian portions, and counting the guests who cannot stand in the queue.\n\nRose has brought a basket of repaired recipe books to auction for the workshop. Catherine has donated vegetables from the estate gardens. Each woman's generosity is real. Each is painfully aware of the other.\n\nWhen the serving table runs short of bowls, Catherine quietly takes her own china from a cabinet. Rose notices and says, almost against her will, “Eleanor used to do that. Bring the good things out for people who didn't have any.” Catherine answers, “I know.” The small bridge might have held if an older volunteer had not added, “That is why we must remember Mrs. Ashford as she was.”","turn":"Rose sets down a tray. “As she was to whom?” The room falls silent. Catherine goes pale. “Please not here,” she says.\n\nThe older volunteer, mortified, tries to apologize. Daniel, who has been carrying the heavy tables, places the last one down and steps away, giving both women room rather than inserting himself as referee. He catches your eye but doesn't intervene without invitation.\n\nAt the sink, Clara Bell arrives unexpectedly. She is small, dignified, with a weathered face and the practiced hands of someone who can make a torn garment useful again. She places a covered casserole on the counter. Rose moves toward her. Catherine freezes. Clara sees Catherine and says softly, “Good evening.” It is impossible to tell whether the words are greeting, permission, or farewell.","pressure":"The evening is on the edge of becoming a public account of a private wound. A dozen guests have come for supper, not spectacle. Clara does not look at you for rescue; she looks at her daughter Rose and at Catherine, who cannot hold her gaze for more than a second.\n\nYou can help create space, but you cannot choose what either woman must say. A good fellowship report can record that the hall is accessible and that the food was served. It cannot turn this moment into a data point without diminishing the people who lived it.","question":"How do you help without taking over?","choices":[{"label":"Offer a quiet room and let the women decide","response":"You show Clara, Rose, and Catherine the small side room and ask whether they would prefer privacy. Clara considers, then says, “Not tonight. But thank you for giving us the choice.” Catherine's expression softens. Rose looks unhappy, yet she does not press her mother. Instead, the three women carry the casserole together. No reconciliation has occurred. Something more modest has: a boundary was honored.","later":"A future family meeting can begin without a public humiliation.","effects":{"ClaraConsent":2,"CatherineTrust":1,"RoseTrust":1}},{"label":"Stand beside Rose when she asks for an apology","response":"You stay close to Rose as she asks whether Catherine can admit the cooperative hurt Clara. Catherine replies, “Yes. It did.” She seems ready to say more, but Clara raises a hand. “Let me decide when this becomes a conversation about my life.” Rose is ashamed and grateful at once. She will remember that you supported her, and that the moment had a cost.","later":"Rose trusts your loyalty but Clara requires clearer boundaries later.","effects":{"RoseTrust":2,"ClaraConsent":-1,"CatherineTrust":-1}},{"label":"Keep the supper moving and check on each woman privately","response":"You draw the volunteers back to serving, then speak to Rose, Catherine, and Clara separately. Clara is grateful that nobody forced her to explain herself. Rose says, “Sometimes practical kindness looks an awful lot like avoiding the truth.” You promise neither to force nor bury the conversation. Catherine offers to help wash dishes once the guests have gone.","later":"WorkerTrust rises; Rose may later question whether you are too cautious.","effects":{"WorkerTrust":2,"ClaraConsent":1,"RoseTrust":0}}],"closing":"After the tables are cleared, Clara finds you by the door. “Rose thinks I've kept her from a truth because I don't trust her,” she says. “That isn't it. I made too many decisions about other people's lives when I was frightened. I will not make this one in the same way.”\n\nShe will say no more. Her right to stop is absolute. Outside, Rose helps Catherine wrestle a heavy folding table into the van; neither speaks, yet neither lets go of the same end. Daniel gives them an exaggerated bow, and for one second Catherine laughs so freely that Rose looks startled.\n\nThe supper ends without resolution. The absence of a resolution has never felt more consequential.","evidence":["Clara personally states she wants to choose the time and manner of disclosure.","Catherine and Rose can work together despite hostility; their relationship is not predetermined."],"echo":["Catherine's earlier trust shows in a small nod when you ask what would help.","Catherine keeps more distance after your direct question, but does not refuse to participate.","Catherine privately asks whether she may review the fellowship notes for factual accuracy."]},{"id":"L6","title":"The Unfinished Promise","day":"Sat · Oct 3","place":"The Orchard Walk, Ashford House","hook":"The question is not whether Rose deserves the truth. It is who has the right to speak it.","opening":"Rain has washed the gravel clean. The estate's orchard stands behind a low stone wall, its last apples bright against the branches. Rose has asked you to walk with her before her scheduled meeting with Catherine. She carries Clara's unfinished letter in a protective sleeve.\n\n“I thought if I could find enough proof, someone would finally admit my mother was wronged,” she says. “But what I found is a sentence about a girl. Maybe it isn't about me. Maybe that's what scares me.”\n\nAhead, Catherine waits beneath an old pear tree. She has neither her usual folders nor her formal coat. She looks younger without them, though no less frightened. The meeting was arranged with Clara's agreement. Clara is recovering from a demanding week and has asked that they speak together early next week, privately, before Rose is given anything she cannot take back.","turn":"Rose holds out the letter. “You knew about this.” Catherine nods. “I know what Eleanor's promise was.” The wind moves through the leaves, making a sound like pages being turned.\n\n“Then tell me,” Rose says.\n\n“I will,” Catherine answers. “But not as another story stolen from Clara. She deserves to be here. You deserve that, too.” Rose laughs once, sharp with disbelief. “Everybody in this town is always telling me what I deserve while keeping something behind a locked door.”\n\nCatherine does not defend Eleanor. “You are right to be angry. I had longer with the truth than you did. I have been afraid of what speaking will cost, and that was unfair.” The admission gives Rose no comfort yet. Some apologies arrive before the injured person is able to receive them.","pressure":"At the orchard gate, Margaret passes with a gardener. She asks whether the weekend's event photographs should include the old founding gallery. Catherine says the gallery is undergoing a records check; the main photograph is missing. Margaret's expression remains professionally concerned. “I'll speak to facilities,” she says. She moves on. Rose watches her go.\n\n“Even the picture of what this place was has vanished,” Rose says. “It's as though the whole town is trying to decide which version deserves to remain.”\n\nCatherine touches the folded edge of Clara's letter. “Whatever you choose to think of me after we talk,” she tells Rose, “I will not let Eleanor's wishes govern it again.”","question":"What do you do at the edge of this revelation?","choices":[{"label":"Protect Clara’s right to be present","response":"“You have waited too long for answers,” you tell Rose, “but this story involves Clara's life and Catherine's. Can we make sure the next conversation belongs to all three?” Rose looks toward the house, blinking hard. “Monday,” she says. “But no more promises with no date.” Catherine agrees to arrange a specific private meeting. There is no embrace—only a commitment that can be kept or broken.","later":"The Week 11 reunion begins with clearer consent and a kept promise.","effects":{"ClaraConsent":2,"RoseTrust":1,"CatherineTrust":2}},{"label":"Ask Catherine to give Rose one true fact now","response":"“Can you tell Rose something true without telling another person's whole story?” you ask. Catherine thinks until the silence is uncomfortable. “Eleanor concealed a family bond,” she says. “She should never have done that.” Rose's eyes fill, though she still doesn't know whose bond. “Then next week,” she whispers, “I want all of it.” Catherine nods. The truth is closer, and the conversation will be more volatile.","later":"Rose enters the future meeting with greater urgency; Catherine may feel exposed.","effects":{"RoseTrust":2,"CatherineTrust":-1,"ClaraConsent":0}},{"label":"Stay with Rose without directing her decision","response":"You stand beside Rose while she decides whether to return home or walk with Catherine. Eventually she says, “I need to call my mother.” Catherine steps back at once. There is respect in her retreat. Rose asks you to wait by the gate while she makes the call. When she returns, she has not learned the secret, but her voice is steadier. “It's mine to hear,” she says. “And theirs to tell.”","later":"Rose values your steadiness; the reunion is less mediated by you.","effects":{"RoseTrust":2,"ClaraConsent":2}}],"closing":"The church bell announces noon. The women part without agreement about Eleanor, or the scandal, or what the town should do with the House of Wisdom. But all three now know that silence has a deadline.\n\nOn your way back through the heritage wing, you pass the locked gallery. Someone has covered an empty picture frame with a linen cloth. A card beneath it reads **THE FOUNDING WOMEN — 1995**. Catherine has already asked for an inventory of what is missing. She cannot yet know who took the photograph.\n\nYou close your casebook on the first week. The most important discovery is not a name. It is a promise that can no longer stay unfinished.","evidence":["Catherine knows the subject of Eleanor’s promise but will not disclose family details without Clara.","The founding photograph is missing; no route falsely solves the theft in Week One."],"echo":["Clara's privacy was respected at supper; Rose comes to the orchard knowing you will not demand a spectacle.","Rose remembers that you stood publicly with her; she now expects you to help press for answers.","Your discretion at supper leaves Clara willing to arrange a private conversation rather than withdraw."]}],"eye":[{"id":"W1","title":"The Missing Signature","day":"Mon · Sep 28","place":"Cooperative Records Office","hook":"A signature is not a fact just because it appears on paper.","opening":"The records office smells faintly of polish and printer toner. Behind the reception desk, a hand-painted sign reads **THE HOUSE OF WISDOM — MADE BY MANY HANDS**. Someone has underlined *many* in pencil. Your supervisor, Miriam Holt, places a thick folder between you and the window.\n\n“Your placement allows you to compare the asset inventory and supporting records,” she explains. “Nothing confidential leaves this room. If you see a discrepancy, write down precisely what it is. Do not decide what it means before you know.” She gives you a temporary visitor badge and an access list, both reassuringly dull.\n\nOn the first page, four industrial sewing machines appear in a recent reconciliation schedule. At the bottom is a scrawled approval attributed to the workshop manager, Helen Price. You have another signed form from Helen, provided as an authorized comparison specimen. The letters lean in different directions; the crossing of the P is unlike the example.","turn":"Miriam sees your pause. “Helen has had a difficult autumn,” she says. “She sometimes signs one-handed while carrying a stack of cloth.” A sensible explanation, not a dismissal. She shows you the copy's provenance: exported from the estate's working document system yesterday. It is not an original contract or a deed.\n\nAcross the yard, the workshop windows glow with activity. Women are mending winter coats; a retired engineer shows an apprentice how to fix a jammed foot pedal. These people need the machines you are examining as entries on paper. That is the point of the review, and also its danger: documents can become more exciting than their human consequences.\n\nYou check the date on Helen's supposed approval. It precedes an internal workshop meeting that appears to have discussed where the four machines should be stored. The sequence is strange but not impossible. Perhaps the arrangement was approved in principle and formalized afterward.","pressure":"At lunch, Helen arrives to sign a visitor access form. Her pen catches in the same spot on the capital P as on the older specimen. She notices the reconciliation schedule on your desk and stops talking. “Who asked you to review that?” she asks.\n\n“Miriam,” you answer, and show her the permission. Helen relaxes only slightly. “Then put the question in writing. I won't have anybody accused in the corridor.” Her reaction could mean embarrassment, anger, or the weary experience of being questioned without preparation. You cannot yet know.","question":"How do you handle the apparent signature discrepancy?","choices":[{"label":"Log the mismatch as unverified","response":"You enter a neutral note: *Signature differs in appearance from the authorized specimen; verification requested.* Helen reads it and nods. “I can work with that. I can't work with gossip.” Miriam adds it to the discrepancy queue, where it will receive a named reviewer. You have neither accused anyone nor buried the concern.","later":"Helen may supply a better comparison specimen in Week 4.","effects":{"EvidenceIntegrity":2,"WorkerTrust":1}},{"label":"Ask Helen directly whether she signed","response":"“May I ask you a narrow question?” you say. “Do you remember approving this schedule?” Helen studies the page. “I remember talking about moving machines. I do not remember signing this version.” She insists that the answer be recorded exactly, not transformed into an allegation. Miriam thanks her for helping at an inconvenient moment.","later":"A firsthand statement will later be compared with system records.","effects":{"EvidenceIntegrity":1,"WorkerTrust":1}},{"label":"Request another authorized specimen first","response":"You ask Miriam for a second signature from the same period. She finds an equipment inspection sheet. The new signature looks a little more like the questionable one, though the pressure and final stroke still differ. “Useful,” she says. “Now we know a quick handwriting comparison cannot settle it.” Your caution leaves the question open in a disciplined way.","later":"Your report begins with corroboration rather than a confident theory.","effects":{"EvidenceIntegrity":2,"JulianConfidence":1}}],"closing":"Miriam closes the folder when the office clock reaches five. “We stop on time,” she says. “That is not laziness. People make terrible decisions when they decide urgency excuses care.”\n\nYou leave with one registered discrepancy and a new appreciation for how a line of ink can affect the lives of people you have not met. As you pass the gallery, a framed photograph catches your eye: Eleanor and three others outside the old workshop. You notice the accountant's ledger tucked under one woman's arm before the corridor light switches off.\n\nTomorrow, you will follow the machines rather than the ink.","evidence":["A reconciliation schedule bears a signature that differs from authorized specimens.","The apparent mismatch is not proof of forgery."],"echo":[]},{"id":"W2","title":"Four Machines, Three Receipts","day":"Tue · Sep 29","place":"Workshop Loading Bay","hook":"A missing receipt can mean a missing object—or merely missing paper.","opening":"Rain drums on the corrugated roof of the loading bay. Helen Price, the workshop manager, leads you past cartons of fabric scraps and a rail of unfinished coats. “We moved equipment because the old floorboards needed repairs,” she says. “Not because somebody wanted to sell it.”\n\nThe schedule identifies four trust-owned industrial machines by serial number. A separate movement sheet describes a temporary relocation to off-site storage. Three carrier receipts are attached; the fourth line is blank. On the chalkboard, a volunteer has written *DO NOT THROW AWAY THE PEDAL FROM 04*. It is a more useful warning than the neat printed schedule.\n\nHelen introduces Arthur, who helped with the move. He remembers three machines going into the truck. “The fourth had a cracked tension wheel,” he says. “I thought it went to maintenance first. But I didn't drive that day, and I can't swear where it ended up.” He does not embellish the story to please you.","turn":"A junior apprentice, Leila, asks if the machines will return before the coat orders are due. Helen answers honestly: “We have spare capacity, but not forever.” You watch Leila calculate the effect on her week's training. In the office the machines were numbered assets. Here, each absence is a stalled skill and a possible lost wage.\n\nThe carrier is called Fenwick Storage. Its printed address on the invoices no longer matches the address on the current public business listing. That might indicate a relocation or a dormant company. You write down the inconsistency without pretending you have discovered a criminal network.\n\nBehind a stack of tables you find a labeled crate containing a machine foot pedal, serial suffix 04. A worker has deliberately kept it safe. The crate is not proof of where the machine is, but it narrows what can have happened to its parts.","pressure":"Miriam has authorized you to inspect the available dispatch records and speak with employees who consent. She has not authorized contacting the storage company as the estate's representative or demanding private commercial records. You can request the appropriate follow-up through Helen or the trustee administrator.\n\nArthur leans on the loading-bay door. “Don't make me into a hero for remembering three things,” he says. “I forget plenty.” His modesty gives his testimony greater value, not less. On the shelf above him, an old wooden plaque bears the cooperative's motto: *What we hold in common, we care for together.*","question":"Which lead do you document first?","choices":[{"label":"Reconcile the dispatch paperwork","response":"You list all four serial numbers, the three receipt identifiers, and the missing acknowledgment. Helen signs off on the accuracy of the list, not on any theory about its cause. “Now we know what needs checking,” she says. “Better than another argument about who remembers which Tuesday.” Miriam arranges an authorized request for the maintenance record.","later":"An additional paper trail becomes available in Week 5.","effects":{"EvidenceIntegrity":2,"JulianConfidence":1}},{"label":"Record Arthur’s recollection carefully","response":"You ask Arthur what he saw, when, and from where. He corrects you twice: it was morning, not afternoon; he saw the truck leave, but not the driver's manifest. “Good,” he says when you adjust your notes. “I was beginning to sound much more certain than I am.” Helen promises that nobody will blame him for the missing receipt.","later":"Arthur may later identify a discrepancy in the transport log.","effects":{"WorkerTrust":2,"EvidenceIntegrity":1}},{"label":"Prioritize the workshop’s immediate equipment needs","response":"You ask Helen what would keep production moving while the records are reviewed. She shows you an older machine that can be repaired with a modest part. Leila volunteers to assist the repair. The investigation continues through Miriam, but the workroom gains a little breathing space. “You remember why we're checking,” Helen tells you.","later":"Workers will volunteer additional observations in Week 4.","effects":{"WorkerTrust":2,"EvidenceIntegrity":0}}],"closing":"Before you leave, Miriam calls with an update: Julian Vale, the solicitor assisting the trust's review, has requested access to original heritage materials, including a founders' photograph. “He is thorough,” she says. “He asks for provenance even when everybody tells him the answer is obvious.”\n\nIn the loading bay, Leila starts the repaired older machine. It clatters unevenly but runs. The sound follows you into the rain.\n\nYou have a missing fourth receipt, not a missing verdict. That distinction will matter when someone begins offering you a much easier explanation.","evidence":["Four machines appear on a temporary relocation schedule; only three carrier receipts are present.","A foot pedal belonging to machine 04 remains in the workshop; physical location remains unverified."],"echo":["Your neutral discrepancy log makes Helen willing to review records with you.","Helen remembers your direct but fair question and offers to clarify her answer in writing.","Miriam has found a second specimen and emphasizes that handwriting alone cannot settle the issue."]},{"id":"W3","title":"The Helpful Administrator","day":"Wed · Sep 30","place":"Estate Records Annex","hook":"A convincing explanation may still be incomplete.","opening":"Margaret Wren arrives carrying a box of neatly labeled folders and two cups of tea. She remembers how you take yours, though you met only yesterday. “Miriam says you have a good eye,” she remarks. “That is a blessing in an office full of people who think a filing cabinet is an archive.”\n\nShe is efficient without being cold. When the lift fails, she personally makes sure an older volunteer can use the ground-floor meeting room. She knows which accounts require trustee approval and which volunteers have been donating unpaid hours. You understand why Eleanor trusted her.\n\nMargaret has prepared a reconciliation summary. It classifies the four machines as estate-owned operating assets, “temporarily unavailable due to maintenance and storage.” The second half may be true. The first half does not match the trust schedule Miriam showed you. Margaret says the old inventory uses convenient headings rather than strict ownership categories.","turn":"“Nothing sinister,” she says, “just fifteen years of imperfect filing. If we stop working until every label is correct, the workshop will close for lack of thread.” It is a persuasive warning. The cooperative has genuine financial difficulties; delay also has human consequences.\n\nYou ask about the storage company's address. Margaret produces a letter describing its move to a new depot. The document is plausible, dated, and signed. “There,” she says. “A small puzzle solved before lunch.” She does not point out that it addresses the depot location but not the missing fourth receipt.\n\nAt the far end of the corridor a maintenance cart stops beside the heritage gallery. Margaret consults her watch. “They close that room this afternoon. A nuisance, but the old frames need inspection.” She carries her document case toward the gallery. You have no reason yet to know she has already seen Julian's request for the original photograph.","pressure":"Miriam later cautions you against treating administrative errors as moral failings. “People who know nothing about the system often think it can be fixed by accusing the right person,” she says. “But ownership categories aren't optional, either.” She invites you to mark which of Margaret's explanations actually answers the facts and which remain untested.\n\nYou realize that Margaret has given you several true statements. A real depot move. A real need for urgency. A genuine history of imperfect filing. Truth can be assembled into a misleading picture as effectively as a lie.","question":"What goes into your casebook about Margaret’s explanation?","choices":[{"label":"Accept it provisionally and note remaining gaps","response":"You record that the depot move is supported but the trust classification and missing receipt remain unresolved. Margaret thanks you for your sensible approach. She is comfortable enough to tell you which committee will review the next report. Your caution gives her no reason to panic, but it also protects the integrity of the inquiry.","later":"Margaret remains less guarded when questions become more specific.","effects":{"EvidenceIntegrity":1,"MargaretAwareness":-1}},{"label":"Request independent confirmation of ownership","response":"You ask Miriam to obtain a certified current trust equipment schedule. Margaret’s smile holds, though her eyes move to the folder. “By all means,” she says. “The trustees are very careful people.” Her subsequent messages become more formal, and she requests copies of questions before answering them. You have increased the pressure without proving intent.","later":"Margaret changes how she communicates in Week 6.","effects":{"EvidenceIntegrity":2,"MargaretAwareness":2,"JulianConfidence":1}},{"label":"Focus first on the missing fourth receipt","response":"You thank Margaret for clarifying the depot address, then bring the conversation back to machine 04. She looks annoyed, an ordinary human reaction to an unanswered administrative question. “I'll ask the warehouse,” she says. You record the promise and its date. It will be possible to check whether she followed through.","later":"The follow-up request leaves an auditable trail in Week 5.","effects":{"EvidenceIntegrity":1,"MargaretAwareness":1,"WorkerTrust":1}}],"closing":"As you leave, the heritage gallery doors are closed behind a green velvet rope. You glimpse a curator holding a frame while a maintenance worker sorts small brass hooks. There is no shattered glass, no alarm, no dramatic figure escaping through the rain.\n\nWhen you return to the corridor, the display-room door is locked for maintenance and the gallery movement register remains on its hook. You have no reason yet to inspect either one. The absence of spectacle will make the later discovery more unsettling.\n\nYour casebook now contains three statements that can coexist: the workshop needs help, the records are disordered, and somebody may be using that disorder. You have not yet learned who.","evidence":["Margaret explains the depot-address change; she has not resolved ownership or the fourth receipt.","The heritage gallery closes Wednesday for scheduled maintenance."],"echo":["Your document reconciliation gives you precise serial numbers to test against Margaret's summary.","Arthur's careful recollection reminds you that an honest witness may still be mistaken.","You are thinking about Leila's work and the practical cost of any unnecessary shutdown."]},{"id":"W4","title":"The Second Ledger","day":"Thu · Oct 1","place":"Historical Society Reading Room","hook":"The missing original left a trail of copies.","opening":"The Willowmere Historical Society occupies a former schoolhouse behind the market. Its reading room contains more rules than chairs: clean hands, pencils only, no unauthorized photographs, and requests filed by collection number. You are visiting under an approved fellowship request for public finding aids, not rummaging through restricted boxes.\n\nThe archivist, Nora Simmonds, brings you an index to the House of Wisdom's historic deposits. A familiar date catches your eye: 1997, one year after the scandal. Beside a line titled **Original Accounts and Correspondence** are the initials *A.W.* and a collection reference beginning **WHS/C6**. The remainder of the entry is obscured by an old binding repair.\n\n“Agnes Whitcomb,” Nora says when you ask what the initials might mean. “Independent accountant. Meticulous woman. She left us boxes with conditions on access, some of which have since expired. Restricted correspondence still needs proper review.” She does not offer to violate those rules for your curiosity.","turn":"In a public catalogue, you find an old exhibition brochure showing Eleanor, Clara, Thomas, and an unnamed fourth person outside the workshop. The fourth woman's arm rests protectively on a ledger. A caption calls them *the founding group*, though there were other women who helped build the cooperative.\n\n“People were always being edited out of pictures,” Nora observes. “Often because the printer needed space, not because of conspiracy. But we keep the original captions where possible.” You appreciate that she refuses to turn an archival accident into a thriller.\n\nThere is another question: why would an independent accountant deposit the original accounts after the scandal, rather than allow them to disappear? The index lists a related correspondence collection, but you cannot yet open the restricted material. Julian may have the proper authority to request review of its conditions.","pressure":"Nora walks you through the difference between a finding aid and the records it describes. The catalogue is evidence that a deposit existed. It is not evidence that its contents prove anything. You copy the exact collection identifier and the restriction note.\n\nOn your way out, Catherine passes you in the courtyard, holding an old key and a plain envelope. She says she has been going through family papers at Ashford House. You recognize the style of key from the estate, but the family archive is not the gallery. You make no accusation.\n\nThen Nora calls you back. “A solicitor named Vale requested the original founders' photograph on Tuesday,” she says. “We suggested he consult the estate gallery. He hasn't received it yet.”","question":"What is your next responsible step?","choices":[{"label":"Share the precise archive reference with Julian","response":"You send Julian only the public catalogue details, including the access restrictions. He replies that he will submit an appropriate formal request and thank Nora for her care. “A reference isn't a revelation,” he writes. “But it is somewhere we can begin.” You have created a credible route toward independent records.","later":"Julian can expedite lawful access to Agnes’s deposit in Week 7.","effects":{"JulianConfidence":2,"EvidenceIntegrity":1}},{"label":"Reconstruct the account chronology first","response":"You return to Miriam with the deposit dates and begin a simple timeline of records: original invoices, the 1996 statement, the 1997 deposit. There are gaps you cannot fill yet, but the sequence itself challenges the assumption that everything relevant was settled in 1996. Miriam agrees to seek formal review of the archive.","later":"Your later investigation will emphasize dates and document provenance.","effects":{"EvidenceIntegrity":2,"JulianConfidence":1}},{"label":"Ask Nora what the collection rules actually allow","response":"Nora appreciates the question. She explains public versus restricted material, conditions on reproduction, and how a legitimate interest can be evaluated without sacrificing other people's privacy. You record the process rather than demanding immediate access. “A trustworthy researcher starts here,” Nora tells you.","later":"Nora is more willing to guide future authorized searches.","effects":{"EvidenceIntegrity":2,"WorkerTrust":1}}],"closing":"You leave the schoolhouse as the market stalls begin closing. Across the street, a little girl asks her grandfather why the clock tower's hands have stopped. “Because nobody has fixed it,” he says. She considers this and asks, “But the time keeps going, doesn't it?”\n\nYour notes show that Agnes Whitcomb preserved something after everyone else wanted the scandal finished. That is all. It is enough to keep looking.\n\nBack at Ashford House, Catherine places the brass key on a family desk. She has been searching for a different kind of truth. The two inquiries share a building, not a motive.","evidence":["The public index identifies A.W. as Agnes Whitcomb and points to an independent 1997 deposit.","The archive has access restrictions; the finding aid alone does not prove fraud."],"echo":["Margaret has not been alerted to a direct ownership challenge; your questions can remain narrow.","Margaret now asks to receive questions in writing, a change you record without assigning motive.","The promised receipt follow-up remains outstanding; the dated request is safely in the file."]},{"id":"W5","title":"A Question of Trust","day":"Fri · Oct 2","place":"Courtyard & Legal Conference Room","hook":"Two men can tell the truth and still leave things unsaid.","opening":"Julian Vale reviews your case notes in a small conference room overlooking the courtyard. He is impeccably polite, but his pencil moves relentlessly through the margins. “This,” he says, pointing to the mismatched signature, “is an observation. This is a theory. And this”—he taps a phrase you wrote about the four machines—“is an assumption pretending to be an observation.”\n\nYou wince. He looks up, almost apologetic. “I am not asking you to stop being curious. I'm asking you not to damage the value of what you've found.” He explains that his duty is to the trust's lawful interests, not to validating an attractive theory. He cannot share privileged advice, but he can tell you how to preserve an accessible record without contaminating it.\n\nOutside, Daniel Mercer is repairing a window latch above the heritage wing. He carries a roll of building plans under one arm and makes a dry joke about the estate's apparent determination to collapse one hinge at a time. His uncle Thomas once helped manage the cooperative; Daniel has spent much of his adult life trying to discover what his family actually did there.","turn":"Daniel shows you a public restoration drawing of the original workshop, where a narrow corridor leads to an old storage room now sealed behind a later wall. “Buildings keep their own records,” he says. “People renovate over what embarrasses them, sometimes without knowing what they're covering.” He speaks carefully. You sense a story he will not share without trust.\n\nAt lunch, Miriam tells you the founding photograph has gone missing from the heritage gallery. Facilities says the frame was removed for maintenance, but the original image is not with the other materials. Margaret, who oversees the records annex, has promised to investigate. Her answer is plausible enough to delay a second question—but the missing movement-register entry is not.\n\nJulian, hearing this, grows still. “I specifically requested that original on Tuesday,” he says. “We need to preserve the catalogue and establish who had authorized custody. Do not interview the staff as though you're the police.”","pressure":"You now have three forms of trust to consider: Julian's insistence on procedure, Daniel's personal connection to the building, and Margaret's position of long-established authority. None requires you to disclose every scrap of information to everyone.\n\nDaniel catches you at the gate. “If you're asking whether my family got money out of the place,” he says, “the answer is I don't know. I intend to find out. But don't ask me to apologize for facts I haven't learned.” There is vulnerability beneath the defensiveness, and you respect it more than a polished speech.","question":"Whose help do you ask for in the next step?","choices":[{"label":"Ask Julian to preserve the gallery custody trail","response":"Julian proposes a formal request for the gallery register, maintenance schedule, and controlled-access inventory. “No shortcuts,” he says. When you agree, he looks at you with a new kind of respect—not romantic intimacy, but professional confidence earned through restraint. “We can work with careful questions,” he says.","later":"Julian later involves you in a documented evidence review.","effects":{"JulianConfidence":2,"EvidenceIntegrity":1}},{"label":"Ask Daniel about the building’s archived plans","response":"Daniel leads you to the town planning office's public drawing set and shows you the difference between the heritage gallery and the family archive. “They're not even on the same key system,” he notes. This becomes important when Catherine's Thursday visit is discussed. Daniel adds that his uncle had access to the older storage wing, a fact he dislikes admitting but refuses to conceal.","later":"Daniel offers context on the building in Week 6; trust deepens.","effects":{"DanielTrust":2,"EvidenceIntegrity":1}},{"label":"Speak to Miriam before involving either man","response":"Miriam helps you sort questions by authority. The missing photograph belongs with the official gallery review; the old workshop plans can be researched publicly. She thanks you for refusing to create a false competition between a lawyer's judgment and an architect's. “Different work, different limits,” she says.","later":"The review receives cooperation from both professionals later.","effects":{"WorkerTrust":1,"JulianConfidence":1,"DanielTrust":1}}],"closing":"As you walk past the covered empty frame, you realize how easy it would be to write a dramatic story in which the vanished photograph and Catherine's private archive visit are one conspiracy. But Daniel has just explained that the rooms use different access systems, and Julian has reminded you that one file request does not prove motive.\n\nYou are beginning to see something larger than a forged signature: a town whose loyalties turn facts into weapons. The harder task is to let facts remain facts long enough to tell the truth.\n\nThat evening, Margaret sends a courteous email: **We are checking the gallery register. Please don't alarm our volunteers with speculation.** It is reasonable advice. It may also serve someone who would prefer not to be questioned.","evidence":["The founding photograph is missing from the gallery after its Wednesday maintenance closure.","The gallery and family archive have separate access systems; Catherine’s visit does not explain the gallery removal."],"echo":["Julian already has your clean archive reference and has begun the lawful access request.","Your chronology makes the gallery disappearance especially troubling beside the 1997 deposit.","Nora has explained exactly which historical records are public and which require permission."]},{"id":"W6","title":"The Altered Record","day":"Sat · Oct 3","place":"Cooperative Records Office","hook":"A system remembers a change. It does not always remember the human hand.","opening":"The office is nearly empty on Saturday morning. Miriam has arranged a supervised review of the working inventory's version history, because the discrepancy cannot wait until the full monthly meeting. The estate's system administrator supplies a read-only export. You sign the access record and sit beside her while she explains how user credentials and timestamps are recorded.\n\nThe copy of the equipment reconciliation that listed the four machines under estate property was modified after the approval date printed on its face. The user account belongs to the estate administration team. Margaret has access to that account, but so did an assistant during the previous quarter. It is a meaningful lead, not proof of who touched the keyboard.\n\nThe edit changed more than a heading: it moved the machines from a line marked **COMMUNITY TRUST — TEMPORARY USE** into a category labeled **ESTATE EQUIPMENT AVAILABLE FOR TRANSACTION REVIEW**. The working spreadsheet's categories do not change the assets' legal ownership, but they could mislead anyone relying on the proposed transaction schedule.","turn":"Helen joins you to inspect the serial numbers. Her earlier recollection now has context. “I approved an equipment condition list,” she says. “I did not approve an estate sale.” She agrees to give a dated statement in the official process. The distinction is careful and devastating in its own quiet way.\n\nJulian arrives with a secure folder for preserving the relevant copies and their provenance. He is direct: “We need the original trust schedules, evidence about the account permissions, and an independent review. We do not need a dramatic accusation made before lunch.”\n\nThrough the office window you see Leila carrying folded coats into the delivery van. The workshop still needs a plan to survive. A technically correct investigation that ignores its people can become another kind of failure.","pressure":"Miriam asks whether you wish to submit an immediate discrepancy report or complete a concise document comparison first. Both are authorized; neither allows you to keep the matter from the responsible trustees once a material concern is established. She says, “What changes is the order and clarity of the report, not whether we do our duty.”\n\nThe archive copy and working file lie side by side. The signature still looks strange. The receipt is still missing. But now you have a specific alteration with a timestamp, a role account, and a false ownership category. The investigation can move beyond suspicion without pretending the identity of the editor is settled.","question":"How do you preserve the finding?","choices":[{"label":"Request immediate formal preservation and trustee notification","response":"You ask Miriam and Julian to preserve the read-only export, request the system's access logs, and notify the trustees through the agreed channel. Julian approves the scope of the request. “You have identified a discrepancy with possible consequences,” he says. “That is enough to act responsibly.” You resist the temptation to put Margaret's name in the subject line.","later":"Trustees start the protective review early; Margaret may adapt.","effects":{"EvidenceIntegrity":2,"TrusteeAlert":2,"JulianConfidence":2,"MargaretAwareness":1}},{"label":"Prepare a careful comparison before the meeting","response":"You spend an hour documenting the original field labels, the changed categories, the timestamps, and the limits of account attribution. Miriam reviews the report and forwards it with the preserved export. It reaches the trustees later that day, but it is unusually clear. “No one will have to guess what you meant,” she says.","later":"The case record is especially clear; formal protective action still follows.","effects":{"EvidenceIntegrity":3,"TrusteeAlert":1,"JulianConfidence":1}},{"label":"Ask Helen to verify what she actually authorized","response":"You bring Helen's signed condition list alongside the altered schedule and invite her to confirm the exact scope of her approval. She writes: *I approved a maintenance relocation, not an asset disposal.* Miriam attaches the statement to the preserved export and notifies the trustees. Helen looks exhausted, then relieved. “That,” she says, “is what I've been trying to say.”","later":"Helen becomes a committed witness; trustees still receive the material concern.","effects":{"EvidenceIntegrity":2,"TrusteeAlert":1,"WorkerTrust":2}}],"closing":"Julian seals the evidence packet in the administrative process, not a theatrical envelope. “Whoever made the change may have a very good explanation,” he says. “If so, we'll find it. If not, we'll find that too.”\n\nYou step into the corridor where the founding photograph once hung. The empty frame has been covered with linen. The space is more compelling than a smashed window would have been. Someone removed an original after Julian asked for it. Someone altered a record after approval. The connections are plausible. They are not yet proven.\n\nThe chapter ends when Miriam locks the records office and says, “Next week we stop asking whether the files are untidy. We start asking who benefits from the untidiness.”","evidence":["The inventory file’s version history records a change after the printed approval date.","An estate administration credential made the edit; that alone does not identify the individual.","The altered category misdescribes trust-owned equipment as available for estate transaction review."],"echo":["Julian prepared the custody-trail request; his evidence process now supports this comparison.","Daniel's building records help keep Catherine's family-archive visit separate from the gallery disappearance.","Miriam has organized the legal and architectural questions into separate workstreams, avoiding a false accusation."]}],"steward":[{"id":"S1","title":"The Workshop in Trouble","day":"Mon · Sep 28","place":"House of Wisdom Workroom","hook":"The numbers matter because the workers do.","opening":"The workshop sounds alive before you see it: the rapid footfall of sewing machines, a kettle rattling on its base, laughter rising above a stubborn machine that refuses to thread. Old leaded windows pour pale light across a long cutting table. Each station bears a name written on paper and fastened with a pin.\n\nVivienne Hart meets you beneath a sign reading **MADE BY MANY HANDS**. Her coat is expensive, but her sleeves are rolled for work. She knows the employees' names, remembers which apprentice is sitting a qualification exam, and returns a misplaced pair of shears to its owner without looking for applause.\n\n“It's a good place,” she says. “That doesn't make it a healthy business.” She opens a notebook: late customer invoices, rising energy bills, a roof repair that cannot be postponed indefinitely. The workshop can keep operating, but each month narrows the options. “Eleanor built something extraordinary. She also left a structure that needs changing.”","turn":"Helen Price, the workshop manager, joins you at a cutting table. “The women aren't a cost to be cut off the bottom of the page,” she tells Vivienne. “We train people nobody else will take on. That takes time.” Vivienne does not dismiss her. “And the training needs paying for,” she replies. “That's the problem I'm here to solve.”\n\nLeila, an apprentice with charcoal dust on her cheek, shows you a collection of repaired winter coats. Each contains a small hand-stitched label bearing the maker's initials. “We do repairs for almost nothing,” she says. “Sometimes that's what keeps people coming through the door. Then they bring friends who can pay.” She is describing both service and a business strategy, though she has never called it that.\n\nYou are permitted to see operating summaries and draft improvement proposals. You are not a board member and cannot promise jobs or money. The limits of your authority feel frustrating until you realize how dangerous it would be to make a promise the cooperative must honor after you leave.","pressure":"Vivienne asks a precise question: “What should the first week tell us?” Helen answers, “Whether you see people.” Vivienne replies, “Whether we can pay them.” Neither is wrong. A sensible rescue will need both views, and the fellowship's role is to make those views part of the same plan.\n\nOn a wall hangs Eleanor's photograph, a formal portrait that makes her look both kind and difficult. A nearby board carries a list of orders waiting to be completed. Names, due dates, and the cost of fabric have been updated in pencil. The portrait is static. The work is not.","question":"Where do you begin your stewardship review?","choices":[{"label":"Listen to employees before prescribing changes","response":"You ask Helen to organize short voluntary conversations with workers across shifts. Vivienne looks impatient, then says, “One day. But ask specific questions.” Leila describes a bottleneck at the shared pressing station that doesn't appear in the financial summary. Helen gives you a small nod. You have made the work visible without rejecting the numbers.","later":"Workers share useful operational details in Week 4.","effects":{"WorkerTrust":2,"VivienneCooperation":0}},{"label":"Build a cash-flow picture first","response":"You ask for the approved financial summary and write down what is known and what is an assumption. Vivienne leans closer, pleased. “Good. We can't help anyone if we spend the rent.” Helen asks you to mark where staffing and training constraints affect the forecast. You do. The numbers begin acquiring names.","later":"Vivienne shares more commercial context in Week 4.","effects":{"VivienneCooperation":2,"WorkerTrust":0}},{"label":"Look for new revenue that preserves the mission","response":"You suggest examining profitable repair packages and training partnerships before debating layoffs. Leila offers an idea for a school-uniform repair service; Helen warns that new work requires capacity. Vivienne begins estimating margins instead of dismissing it. None of you calls the idea a rescue yet.","later":"A service-based revenue option develops in Week 5.","effects":{"WorkerTrust":1,"VivienneCooperation":1}}],"closing":"When the afternoon bell rings, everyone helps clear the tables. Vivienne stays to fold a bolt of cloth, though she has a car waiting. “My father liked to talk about saving places,” she says, looking at the unfinished coats. “I would r
