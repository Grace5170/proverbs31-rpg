ather be judged by what I actually save.” You recognize the name Hart but not the significance of her father's history.\n\nAs you leave, the building creaks in the wind. The enterprise is fragile, but it is not helpless. The first task is not choosing a hero. It is refusing to confuse urgency with permission to overlook the people affected.","evidence":["The workshop faces real cash-flow and maintenance pressures.","Vivienne’s proposed rescue may help, but its terms are not yet settled."],"echo":[]},{"id":"S2","title":"The Price of Progress","day":"Tue · Sep 29","place":"Workshop Design Studio","hook":"An attractive offer can ask for more than money.","opening":"The design studio is a converted attic lined with sample dresses, school-uniform patterns, and photographs of former apprentices opening their own businesses. Vivienne spreads her investment proposal across a drafting table. The numbers are encouraging: equipment repair funds, working capital, a marketing budget, and a chance to bring the workshop's high-quality garments to a wider market.\n\nThen she turns to the conditions. Her firm would receive exclusive commercial rights to certain new design collections for a defined term. The firm also wants access to machines and premises listed in the estate's transaction schedule. “If I take the risk,” she says, “I need to know what the business can reliably use.”\n\nYou understand the logic, and also the danger. Exclusive rights may help finance expansion, but a badly drawn arrangement can leave the people who developed the designs without fair reward. The estate schedule may not describe property that Eleanor still owned when she died.","turn":"Helen joins you with two apprentices. One is delighted at the possibility of larger orders; the other asks whether their names will remain on the garments. Vivienne says yes, but the proposal does not expressly require it. You point out the gap. Vivienne makes a note rather than becoming angry.\n\n“Nothing is signed,” she reminds you. “I'm showing you the first offer because I want informed questions, not applause.” It is a credible invitation. She believes money and management can save the cooperative, and it is possible that she is right in part.\n\nA footnote refers to **Property Schedule B: Garden Lodge and Associated Operational Assets**. The schedule is supplied by estate administration. Its descriptions are broad enough to include the main workshop and machinery, though no supporting title documents are attached to this draft. The phrase *associated operational assets* troubles you more than any interest rate.","pressure":"You could reject the proposal as greedy. You could embrace it as salvation. Neither response would establish whether the cooperative is being offered a genuine lifeline or invited to surrender too much.\n\nVivienne closes her folder. “My advisers will ask difficult questions of your people. You should ask difficult questions of mine.” She looks down at the apprentices' sample dresses, then adds, almost reluctantly, “I don't want to do what my father did—walk away from a place after taking the best of it.” You do not yet know what she believes her father did.","question":"What recommendation do you make about the proposal?","choices":[{"label":"Negotiate explicit protections for makers and mission","response":"You propose limits on exclusivity, attribution for designers, and protections for training time. Vivienne pushes back on the length of the proposed term, but she agrees to put alternatives on paper. “I won't promise charity where I need a business,” she says. “But I won't buy an entire future for a single price, either.” The conversation becomes a negotiation instead of a quarrel.","later":"Vivienne is more open to a revised investment in Week 6.","effects":{"VivienneCooperation":2,"WorkerTrust":1}},{"label":"Request independent financing comparisons","response":"You suggest comparing the offer with grants, small loans, partnerships, and customer preorders. Helen looks relieved; Vivienne looks skeptical but not offended. “Do it quickly,” she says. “An alternative that arrives after the bills is no alternative.” You record that urgency as a genuine constraint rather than a threat.","later":"A competing funding route becomes available, but time pressure remains.","effects":{"WorkerTrust":1,"VivienneCooperation":-1,"EvidenceIntegrity":1}},{"label":"Ask for verification of Schedule B before judging terms","response":"You point to the phrase *associated operational assets*. Vivienne frowns. “That description came from estate administration.” She agrees that the ownership documents should be checked before anyone assumes the premises and machines form one saleable package. “A cautious investor should welcome that,” she says, though the caution will cost her time and legal fees.","later":"The property-description issue is documented earlier.","effects":{"EvidenceIntegrity":2,"VivienneCooperation":1,"TrusteeAlert":1}}],"closing":"As you leave, Leila calls you back to see a coat she has repaired. Its lining is decorated with a tiny hidden flower. “The customer won't see it,” she says, “unless the coat tears again.” You ask why she bothered. “Because I know it's there.”\n\nVivienne is waiting at the stairs. She has heard the answer. “That's the hard part of this place,” she says quietly. “Some of what makes it valuable doesn't appear on the valuation.”\n\nYou write the sentence in your notes. It will matter when a payment is made for an asset package that may not belong to the person selling it.","evidence":["Vivienne’s proposal contains exclusive design-rights terms that require negotiation.","Property Schedule B includes ambiguously described operational assets."],"echo":["Workers have already identified practical bottlenecks that a rescue plan must address.","Vivienne brings an updated cash-flow page, knowing you will check its assumptions.","The uniform-repair idea remains on the table as a possible source of additional income."]},{"id":"S3","title":"The Four Missing Machines","day":"Wed · Sep 30","place":"Workshop Store & Yard","hook":"Four assets on a schedule, three on a truck, none where they belong.","opening":"On the workshop floor, four chalk outlines mark spaces where industrial machines stood before repairs began. The floorboards are newly exposed, and dust has gathered inside the marks. Helen walks you through the temporary movement plan: four trust-owned machines were to be relocated so repairs could be completed. The schedule says all four went to Fenwick Storage.\n\nThe paper trail says otherwise. Three carrier receipts are attached. The fourth has a blank acknowledgment line. Arthur, who helped with the move, remembers only three machines loaded on the truck. He adds that machine 04 had a cracked tension wheel and may have been sent for repair separately. “I have a memory,” he says, “not a receipt.”\n\nLeila shows you the foot pedal from machine 04, labeled and saved in a wooden crate. “We put it here because someone would lose it otherwise,” she explains. Helen is more worried about the shortage of working equipment than about anybody's personal embarrassment.","turn":"Margaret Wren arrives to check the repair schedule. She carries a practical list of contractors and knows exactly which floorboard needs replacing. When you ask about the machines, she says the move was administrative housekeeping and points to the storage sheet. “The workshop needs to work, not spend all day proving what we already know,” she says with a smile.\n\nYou note that the schedule classifies the machines under estate equipment, whereas the trust list identified by Miriam describes them as community-trust property. The mismatch matters even if all four machines are safe. It would matter even more if the property schedule in Vivienne's proposal is using the same mistaken category.\n\nA delivery driver offers an easy theory: “Someone probably took the fourth one.” You ask whether he saw that happen. He admits he did not. Helen thanks you for making the question plain. A rumor would be less useful than a properly labeled crate.","pressure":"Vivienne telephones. She needs an accurate equipment list to estimate how soon production can scale. You explain that you are verifying location and ownership, not accusing anyone. “Please do,” she says. “My advisers are pricing capacity on those machines.”\n\nThe distinction between where a machine is stored and who owns it becomes the day's central problem. Both questions affect the workshop. Only one can be answered by finding the foot pedal.","question":"What do you verify first?","choices":[{"label":"Reconcile all four serial numbers","response":"You copy each trust-schedule serial number beside the movement records and distinguish verified location from unverified location. Helen is grateful that you do not label a machine stolen because the receipt is absent. Vivienne receives a cautious capacity estimate, not a promise about equipment she cannot yet rely on.","later":"The Week 5 asset reconciliation has a strong documentary starting point.","effects":{"EvidenceIntegrity":2,"VivienneCooperation":1}},{"label":"Speak with workers and transport staff","response":"You ask Arthur and Leila for consent to write down what they personally saw. They disagree slightly about the time of the move, then jointly remember the separate maintenance crate. Helen realizes a repair shop may have an older job number. “That's worth checking,” she says. The employees begin contributing rather than defending themselves.","later":"Workers provide additional logistics context in Week 5.","effects":{"WorkerTrust":2,"EvidenceIntegrity":1}},{"label":"Plan temporary production around the equipment gap","response":"You help Helen calculate what orders can be completed on the remaining machines and what repairs should happen first. The workers welcome the practical help. You also request that Miriam verify the ownership schedule; a production plan cannot cure a bad property record. Vivienne sees that you can hold both concerns at once.","later":"A credible short-term operations plan strengthens the later rescue proposal.","effects":{"WorkerTrust":2,"VivienneCooperation":1}}],"closing":"That afternoon, the gallery closes for frame maintenance. Margaret takes a document case past the workshop courtyard, pausing to ask after Helen's grandson. Nobody has reason to view her as a thief. She has earned trust through hundreds of ordinary acts of competence.\n\nYou look at four chalk outlines on the floor. The spaces were made by real machines that served real people. On Schedule B, the same machines appear as assets the estate may provide to an investor. The numbers are identical. The legal categories are not.\n\nIt is the kind of problem a rushed transaction can carry silently all the way to the signature line.","evidence":["Four trust-owned machines appear on a storage schedule; location of machine 04 is unverified.","The same machines appear in a proposed estate transaction package."],"echo":["Vivienne is open to discussing maker protections; you can raise the ownership concern without ending negotiations.","Your funding comparisons make it especially important not to overstate the workshop's usable assets.","The ambiguity in Schedule B was already flagged, so this discrepancy has an established paper trail."]},{"id":"S4","title":"A Rival’s Warning","day":"Thu · Oct 1","place":"Market Square & Needle & North","hook":"A rival may be protecting her own business—and still be right.","opening":"The market square is bright with autumn produce, wet canvas, and the smell of coffee. A sign above a narrow storefront reads **NEEDLE & NORTH — REPAIRS, PATTERNS, AND SMALL RUNS**. Its owner, Mara Sloane, has requested ten minutes of your time.\n\nMara once apprenticed at the House of Wisdom. She now employs six people, two of whom formerly worked at the cooperative. She makes no secret of competing for the same customers. “I didn't leave because I hated the place,” she says. “I left because it wouldn't let me try anything new. I'd hate to see it swallowed by a deal that claims to be progress.”\n\nYou have been warned that Mara is jealous of Vivienne. Mara laughs when you tell her. “Of course I'm jealous. I would love the kind of money she can raise. That doesn't make every concern I have imaginary.” She produces an unsigned draft of an exclusivity clause circulated to potential subcontractors.","turn":"Under the clause, outside businesses using certain House of Wisdom designs could be restricted from selling similar products. Mara worries that a single investor could control a wide category of designs, including work that apprentices helped develop. The document is a draft, not a final contract; its definitions are broad enough to deserve review.\n\nMara also admits that she would profit if the cooperative's expansion failed. “I won't dress that up as altruism,” she says. “But my grandmother learned to sew there. The place means more than a market share.” She offers to help with an alternative local production partnership if the proposed exclusivity terms can be narrowed.\n\nA customer arrives carrying a damaged wedding dress. Mara patiently explains that the repair will be visible and gives a fair price rather than promising perfection. Her candor in business is more persuasive than her suspicion of Vivienne.","pressure":"Vivienne's response to your call is equally pointed. “Mara wants a seat at the table without contributing capital,” she says. “But if her concern is the clause, send me the clause. We can discuss the words.” You now have two ambitious women, each partly right, both inclined to suspect the other's motives.\n\nA fellowship meant to strengthen the cooperative cannot solve the problem by declaring one of them villain and the other savior. The contract will have to withstand careful reading, as will their proposed partnerships.","question":"How do you handle Mara’s warning?","choices":[{"label":"Invite a concrete alternative partnership","response":"You ask Mara for a written proposal showing capacity, fair pricing, and protections for workers and original makers. She grins. “A chance to prove I'm useful instead of just loud?” She agrees. Vivienne dislikes the idea at first, but says she will evaluate any proposal that meets the workshop's standards. Competition becomes a possible resource rather than a feud.","later":"An independent production partnership becomes available in Week 7.","effects":{"WorkerTrust":1,"VivienneCooperation":0,"EvidenceIntegrity":1}},{"label":"Challenge Mara to support her allegation","response":"“Show me the exact clause and explain the harm you expect,” you say. Mara takes no offense. She marks the broad definition with a pencil and identifies the designs that might be affected. “There,” she says. “Now we're arguing about words instead of personalities.” Vivienne later agrees to review a narrower definition.","later":"The contract review focuses on enforceable language rather than rumor.","effects":{"EvidenceIntegrity":2,"VivienneCooperation":1}},{"label":"Bring both women into a facilitated review","response":"You propose a meeting with Helen present, so workers are not represented only by competing business owners. Mara agrees reluctantly. Vivienne asks for a clear agenda and a deadline. The discussion will be uncomfortable, but the option of a workable shared arrangement has opened. Leila asks whether apprentices may send written comments. You say yes.","later":"Employee and business input shapes the Week 6 negotiation.","effects":{"WorkerTrust":2,"VivienneCooperation":1}}],"closing":"You leave the shop with an unsigned clause and a list of questions. Neither woman has asked you to abandon the cooperative's mission. Both have asked you to see the world through her risks.\n\nIn the square, the stopped clock seems less mysterious than it did on arrival. The answer to why it doesn't move is probably a neglected repair and an argument about who should pay. The consequences, though, belong to everyone waiting beneath it.\n\nAs the rain begins again, a courier hurries toward Ashford House carrying a slim folder marked **PROPERTY SCHEDULE B**. There is a signature space on its cover. The transaction is moving faster than your questions.","evidence":["Mara’s concern about design exclusivity is commercially plausible but unproven.","Mara may offer an alternative production partnership; she is not automatically the moral winner."],"echo":["Your serial-number review reveals a clear ownership mismatch worth raising with trustees.","Employee accounts have identified the repair crate and possible maintenance trail for machine 04.","Your short-term capacity plan shows why equipment verification is urgent without implying wrongdoing."]},{"id":"S5","title":"The Beneficiary Clause","day":"Fri · Oct 2","place":"Governance Office","hook":"An organization cannot sell what it has promised to hold for others.","opening":"Miriam Holt places two approved governance documents before you: a plain-language summary of the 2023 community trust and the working property schedule supplied to Vivienne's advisers. The first identifies the workshop property and four numbered machines as trust assets. The second lists them among assets being reviewed for an estate transaction.\n\n“The trust is not a rumor,” Miriam says. “The trustees know it exists. The trouble is that people working from old inventories sometimes use the wrong categories.” She pauses, looking at Schedule B. “This particular wrong category could cause serious harm.”\n\nThe trust's purpose is not to make Eleanor's family poor or rich. It holds specified assets to support the cooperative's charitable and community activities under its governing terms. There is a separate Garden Lodge that belongs to Eleanor's estate. The documents are clear enough to explain the difference, even though the final legal review belongs to the trustees and their advisers.","turn":"Julian joins the meeting to explain the procedural limits. “A working schedule is not a deed,” he says. “And an inaccurate list cannot give someone ownership. But if a proposed deal is priced or promoted using property the seller cannot convey, that must be corrected before anyone relies on it.”\n\nYou ask how the discrepancy could have survived. Miriam offers several possibilities: copied templates, outdated internal software, hurried communications. Julian adds a less comforting possibility: someone benefited from leaving the mistake uncorrected. Neither asks you to decide which is true.\n\nCatherine arrives unexpectedly with a box of historical meeting minutes she is authorized to share with the trustees. She looks weary after a visit to the family archive yesterday. “Eleanor wanted the workshop protected,” she says. “She also hated admitting when she was wrong. I don't know which impulse shaped which document.”","pressure":"Outside, a delivery van is unloading fabric. The cooperative keeps moving while the governance question hangs over the table. If the trustees freeze every possible activity, jobs and orders may be lost. If they ignore the mismatch, they invite reliance on a false description of the transaction. The duty is neither panic nor passivity.\n\nVivienne asks to be told when the trustees approve a corrected asset list. “My firm won't price a purchase on disputed property,” she says. The reply is commercial self-interest as much as prudence; that does not make it worthless.","question":"How do you help the responsible parties?","choices":[{"label":"Ask trustees to formally clarify their asset schedule","response":"You prepare a neutral summary of the mismatch and submit it through Miriam for the trustees. The trustees' secretary acknowledges receipt and begins a controlled reconciliation. Julian thanks you for not treating an internal schedule as authority. “The remedy begins with knowing who can make which decision,” he says.","later":"The trustees are alerted early; protective steps can be taken promptly.","effects":{"TrusteeAlert":2,"EvidenceIntegrity":1,"JulianConfidence":1}},{"label":"Request the underlying ownership documents through Julian","response":"You ask Julian what supporting documents the authorized review can examine. He explains the deed, equipment schedule, and trust instrument without handing you privileged material. You write down what each document can and cannot establish. The trustees are notified by Miriam of the mismatch; the detailed legal review follows.","later":"The Week 8 record trail will be particularly strong.","effects":{"EvidenceIntegrity":2,"JulianConfidence":2,"TrusteeAlert":1}},{"label":"Prepare a corrected operating-capacity summary for Vivienne","response":"You mark which machines are trust-owned and which items are actually part of the estate's proposed transaction. Vivienne appreciates that a careful capacity plan helps her evaluate the investment without claiming the property is hers to acquire. Miriam separately alerts the trustees to the erroneous schedule.","later":"Vivienne can consider a restructured offer without the disputed asset package.","effects":{"VivienneCooperation":2,"TrusteeAlert":1,"EvidenceIntegrity":1}}],"closing":"When the meeting ends, Catherine lingers beside an old photograph of the workshop. “My aunt wanted the place to belong to the women who made it matter,” she says. “I think she believed putting it in a trust was enough to make that happen.”\n\n“Was it?” you ask.\n\nCatherine studies the empty corridor. “Only if people are willing to honor what the words mean.”\n\nA trust is not a spell. It is a set of obligations requiring living people to act. You close your notes and realize that the Week One report already has something important to say.","evidence":["The 2023 trust identifies the workshop and four numbered machines as trust assets.","The transaction’s Schedule B incorrectly includes trust property in an estate asset package."],"echo":["Mara is preparing a concrete partnership proposal; its terms may provide leverage for better negotiations.","You have marked the broad exclusivity clause; the ownership issue now has an equally precise documentary reference.","Helen and the apprentices expect to be consulted before any new operating arrangement is announced."]},{"id":"S6","title":"The Price Already Paid","day":"Sat · Oct 3","place":"Ashford House Boardroom","hook":"The rescue money is real. So is the cost of believing an incomplete schedule.","opening":"The boardroom faces the village rooftops. Vivienne has come to present an updated investment timetable to the authorized review group. She brings crisp financial models, practical questions, and a noticeably thinner patience for uncertainty. “We can't rescue the workshop with a series of perfectly documented delays,” she says.\n\nThen Miriam places a payment confirmation beside the proposal. Vivienne's firm paid **£18,000** to Hearthbridge Advisory Ltd for exclusivity and due diligence relating to the proposed property package. The payment was made before trustees confirmed what the estate could lawfully offer. It is real money, committed by a potential investor on the strength of a schedule that is materially inaccurate.\n\nVivienne is not surprised that the payment exists. “My finance director signed it off,” she says. “I approved the budget. Hearthbridge represented itself as the estate-side transaction adviser.” She is surprised, however, that the same schedule appears to include trust property that the estate cannot independently sell.","turn":"Julian explains the significance without making promises about outcomes. The fee's label as nonrefundable may be contested or enforceable depending on its terms and the facts. Neither the player nor the trustees can simply declare it stolen or lost. More immediately, the parties must stop relying on an asset description known to be misleading.\n\nVivienne walks to the window. You can see people moving in the workshop below. “If I pull the proposal,” she says, “they lose the most plausible source of working capital they've had in months. If I keep negotiating on bad information, I make my own firm part of the problem.” She looks at you. “You asked for ethical tradeoffs. Here is one.”\n\nMiriam finds Hearthbridge's disclosure statement. It identifies the company and its fees but does not disclose any beneficial connection to Margaret. You cannot know from the paperwork that Margaret has an interest. You can ask who controls the intermediary and whether the disclosures are complete.","pressure":"Catherine arrives with the trustee secretary. She is visibly afraid that yet another scandal will consume the workshop. But she also knows Eleanor's silence once caused terrible harm. “We can't cure a bad record by asking everybody to trust us one more time,” she says.\n\nFor the first time you see Vivienne hesitate without a ready argument. “Then find out what the estate actually owns,” she says. “And let me decide whether I still want to invest in what it can legitimately offer.”\n\nNobody in the room has the authority to erase the £18,000 payment. Nobody has the right to ignore the workshop's needs. Both realities now occupy the same table.","question":"What do you recommend for the next formal step?","choices":[{"label":"Request disclosure and an independent accounting of the fee","response":"You recommend asking for Hearthbridge's beneficial ownership disclosures, payment terms, and supporting engagement letters through the proper channels. Julian agrees that the questions are material. Vivienne is unhappy about the delay but supports a documented request. “If somebody profited from selling me a false description,” she says, “I want to know who.”","later":"Week 9 can examine the intermediary’s financial relationships sooner.","effects":{"EvidenceIntegrity":2,"JulianConfidence":1,"VivienneCooperation":1,"TrusteeAlert":1}},{"label":"Ask Vivienne to consider a corrected rescue proposal","response":"You propose separating a legitimate operating investment from any property purchase that requires further approval. Vivienne studies the cash-flow sheet. “We might be able to support orders and training under a different agreement,” she says. “But I won't promise that before my advisers examine it.” The workers gain a possible path that does not rely on disputed title.","later":"A narrower, lawful investment structure may be available in Week 7.","effects":{"VivienneCooperation":2,"WorkerTrust":1,"EvidenceIntegrity":1}},{"label":"Prioritize worker continuity while trustees review the deal","response":"You recommend a short-term operations plan: keep contracted orders moving, protect payroll decisions, and communicate honestly without implying a transaction is already approved. Helen commits to preparing the production schedule. Vivienne agrees not to pressure employees with public deadlines while the ownership issue is reviewed.","later":"Worker support remains strong even if the sale proposal changes.","effects":{"WorkerTrust":2,"TrusteeAlert":1,"VivienneCooperation":1}}],"closing":"The group agrees to preserve the documents, notify the appropriate decision-makers, and correct the misleading asset description before further reliance on it. No one announces a miraculous rescue. Nor does the workshop close.\n\nAs you leave, Leila asks how the meeting went. You cannot disclose confidential negotiations, but you can tell her the truth within your role: the work continues, the people responsible are examining the terms, and nobody is entitled to treat the trust's machines as disposable estate property.\n\nThat night, you review your notes beside the map Eleanor left you. A question has been forming all week: if the House of Wisdom was built to serve its community, why has the argument about saving it begun to resemble an argument about who can take it?","evidence":["Vivienne’s firm paid £18,000 to Hearthbridge for exclusivity and due diligence.","Hearthbridge’s disclosure form leaves its ultimate beneficial control unclear; the reason is not yet established.","A revised operating investment may be possible even if the property package is invalid."],"echo":["The trustees were alerted early, so Saturday's discussion can focus on remedies rather than first discovery.","Julian has the governing-document trail ready; the error is now documented without claiming it changes title.","Vivienne trusts your corrected capacity work and is more receptive to restructuring the proposal."]}]},"endings":{"heart":{"title":"The Unfinished Promise","sub":"CHAPTER ONE COMPLETE — THE LISTENING HEART","body":"Rose walks toward the village with Clara's letter in her coat pocket. Catherine remains beneath the orchard tree, watching until her figure disappears. You stand between two women who are closer than either of them knows the other is ready to admit.\n\nNo secret has been solved for you. No stranger has been granted the right to disclose a family's pain. What changed this week is more difficult to measure: a letter was read with care, a woman's invitation was corrected, an apology was made without demanding pardon, and three people agreed that the truth must finally be spoken in a room where they can all answer for themselves.\n\nAs evening settles over Ashford House, the heritage gallery remains shut. Behind the linen cloth hangs an empty frame. Somewhere in Willowmere, the missing photograph still exists. Its absence is not the same mystery as Clara's promise, but both belong to a town that has practiced silence for too long.\n\n**Your unanswered question:** What did Eleanor promise Clara—and who has the right to hear it first?","reflection":"This week, where did listening require courage rather than easy agreement?"},"eye":{"title":"The Altered Record","sub":"CHAPTER ONE COMPLETE — THE WATCHFUL EYE","body":"Miriam signs the evidence handover sheet. Julian sends the trustees a notice that the equipment categories require verification. Helen returns to the workshop to ensure the coats are finished on schedule. They all go back to ordinary responsibilities, and that is precisely what makes your discovery consequential.\n\nThe computer can show when the working copy changed. It cannot yet tell you who sat at the keyboard, why the edit was made, or whether that person had authority to amend the asset description. The missing gallery photograph may prove unrelated. You have not solved a conspiracy; you have established a question that cannot responsibly be ignored.\n\nOutside, the stopped clock casts a long shadow over the street. It still tells the wrong time, yet the village carries on beneath it. You think of Eleanor's note: *A woman who sees must ask what she has failed to notice.* Today you found the alteration. Next week you must find out what it concealed.\n\n**Your unanswered question:** Who changed the ownership category after approval—and who stood to gain?","reflection":"This week, when did a careful question protect someone from an unjust accusation?"},"steward":{"title":"The Price Already Paid","sub":"CHAPTER ONE COMPLETE — THE WISE STEWARD","body":"The workshop lights remain on after the boardroom empties. Leila is finishing a lining; Helen is revising the order board; Vivienne is calling her advisers to ask what an honest offer would look like without a disputed property package. None of them has been rescued. None has been abandoned.\n\nThe £18,000 payment is recorded. The estate schedule is under review. The trustees know that assets held for community purposes have been described as though they are ordinary estate property. These facts do not close the business; they narrow the terms on which its future can be negotiated. Whether the fee can be recovered, and whether the original investor will stay, remain unresolved.\n\nYou look once more at Eleanor's portrait beside the workroom door. Beneath it is a newer display: repairs completed by apprentices, each tagged with a name. The House of Wisdom's real wealth has never fitted neatly into a sale schedule. That does not mean it can survive without money. It means the money must serve what makes the place worth preserving.\n\n**Your unanswered question:** Who profited from describing community property as if it were for sale?","reflection":"This week, what resource or responsibility needs both compassion and careful accounting?"}}};
const KEY='house-of-wisdom-week-one-v14';
const R = {heart:'L',eye:'W',steward:'S'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const markup=s=>esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
const paragraphs=s=>String(s||'').split(/\n\s*\n/).map(p=>'<p>'+markup(p.trim()).replace(/\n/g,'<span class="softbreak"> </span>')+'</p>').join('');
const base=()=>({name:'',routes:{heart:{at:0,choices:{}},eye:{at:0,choices:{}},steward:{at:0,choices:{}}},week:{priority:'',service:'',skill:'',heartReflection:'',eyeReflection:'',stewardReflection:'',giving:'',reward:'',free:''}});
let canStore=true;
function load(){try{const s=localStorage.getItem(KEY);if(s){let v=JSON.parse(s);if(v&&v.routes){let b=base();return {...b,...v,routes:{...b.routes,...v.routes},week:{...b.week,...v.week}}}}}catch(e){canStore=false;}return base();}
let state=load(),view='home',active='heart',priorView='story';
const stage=()=>state.routes[active]||{at:0,choices:{}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));canStore=true;}catch(e){canStore=false;}}
const app=document.getElementById('app');
function header(){return `<header class="mast"><div class="brand"><span class="seal">✧</span><span>THE HOUSE OF WISDOM</span></div><nav class="mast-actions" aria-label="Main navigation"><button class="ghost" onclick="go('home')">Paths</button><button class="ghost" onclick="go('casebook')">Casebook</button><button class="ghost" onclick="go('week')">Your week</button></nav></header>`}
function shell(inner){app.innerHTML=`<div class="page">${header()}<main class="container" id="main">${inner}</main><footer class="footer">Chapter One · 28 September–4 October 2026 · Sunday is a protected rest day<br>${canStore?'Progress saved locally in this browser.':'Local saving unavailable: use Export to keep a copy.'}</footer></div>`;wireWeekInputs();}
function go(v){if(v==='casebook'||v==='week')priorView=view;view=v;render();window.scrollTo({top:0,behavior:'instant'});}
function start(r){active=r;view='story';render();window.scrollTo({top:0,behavior:'instant'});}
function setName(v){state.name=v.slice(0,50);save();}
function home(){const cards=Object.keys(BOOK.routes).map(k=>{let r=BOOK.routes[k],p=state.routes[k],completed=Object.keys(p.choices||{}).length;return `<button class="route-card" style="--accent:${r.color}" onclick="start('${k}')"><span class="route-num">${r.mark}</span><h3>${esc(r.name)}</h3><p>${esc(r.tag)}</p><span class="small">${completed===6?'Chapter One complete':completed?`${completed} / 6 scenes completed`:'Begin this path'} · ${esc(r.role)}</span></button>`}).join('');
return `<div class="eyebrow">A twelve-week interactive mystery · Chapter One ready to play</div><h1 class="lead">Every house keeps<br>a secret.</h1><p class="subtitle">Three women. Three ways of finding the truth. One legacy worth saving—if it can survive the truth.</p><div class="field" style="max-width:420px"><label for="name">Your character's name (optional)</label><input id="name" class="input" placeholder="Your name" maxlength="50" value="${esc(state.name)}" oninput="setName(this.value)"></div><div class="intro prose">${paragraphs(BOOK.prologue)}</div><div class="line"></div><div class="eyebrow">Choose your placement</div><h2 class="section-head" style="margin-top:8px">Three playable story paths</h2><p class="tiny">Each route has six substantial scenes, consequential dialogue, evidence, its own chapter-ending screen and independent saved progress.</p><div class="route-grid">${cards}</div><div class="alert">The core truth is fixed; your choices shape trust, testimony, cooperation and how the truth unfolds. You can play all three paths independently.</div><div class="buttons"><button class="secondary" onclick="exportProgress()">Export saved progress</button><button class="secondary" onclick="document.getElementById('import-file').click()">Import saved progress</button><input id="import-file" class="sr-only" type="file" accept=".json,application/json" onchange="importProgress(this)"></div>`;}
function stats(){let tally={};const p=stage();for(let [id,n] of Object.entries(p.choices||{})){const s=BOOK.scenes[active].find(x=>x.id===id);if(!s||!s.choices[n])continue;for(let [k,v] of Object.entries(s.choices[n].effects||{}))tally[k]=(tally[k]||0)+v;}return tally;}
function sceneView(){let p=stage(),i=Math.min(p.at,6),r=BOOK.routes[active];if(i>=6)return endingView();const s=BOOK.scenes[active][i],ch=p.choices?.[s.id];const chosen=ch===undefined?null:s.choices[ch];let echo='';if(s.echo?.length&&i){let prior=BOOK.scenes[active][i-1],n=p.choices?.[prior.id];if(n!==undefined)echo=`<aside class="inset"><span class="hold">A choice remembered</span><div>${markup(s.echo[n])}</div></aside>`;}
return `<div class="toprow"><span class="eyebrow">${state.name?esc(state.name)+" · ":""}${esc(r.name)} · Chapter One</span><span class="scene-meta">Scene ${i+1} of 6 · ${esc(s.day)}</span></div><div class="progress" aria-label="Scene progress"><div style="width:${((i+1)/6)*100}%"></div></div><div class="scene-meta">${esc(s.place)}</div><h1 class="scene-title">${esc(s.title)}</h1><div class="scene-kicker">${esc(s.hook)}</div>${echo}<div class="prose">${paragraphs(s.opening)}<div class="scene-divider">✦ ✦ ✦</div>${paragraphs(s.turn)}<div class="scene-divider">✦ ✦ ✦</div>${paragraphs(s.pressure)}</div><section class="choice-box" aria-label="Interactive story decision"><div class="eyebrow">Your decision</div><h2 class="choice-title">${esc(s.question)}</h2>${s.choices.map((c,n)=>`<button class="choice ${ch===n?'selected':''}" aria-pressed="${ch===n}" onclick="pick('${s.id}',${n})"><span class="choice-index">${n+1}</span><span>${esc(c.label)}</span></button>`).join('')}</section>${chosen?`<section class="answer" aria-live="polite"><div class="answer-label">Because you chose: ${esc(chosen.label)}</div><div class="prose">${paragraphs(chosen.response)}</div></section><section class="after prose">${paragraphs(s.closing)}</section><aside class="inset"><span class="hold">Casebook updated</span><div>${esc(s.evidence[0])}</div></aside>`:''}<div class="buttons">${i>0?`<button class="secondary" onclick="prev()">← Previous scene</button>`:`<button class="secondary" onclick="go('home')">← Paths</button>`}<button class="primary" ${!chosen?'disabled style="opacity:.42;cursor:not-allowed"':''} onclick="next()">${i===5?'Finish Chapter One':'Continue the story →'}</button></div><p class="tiny">${chosen?'Your decision is saved. Revisiting a scene may change that decision and its future echoes.':'Choose a response to reveal what happens next. Essential clues will remain accessible.'}</p>`;}
function pick(sid,n){const s=BOOK.scenes[active].find(x=>x.id===sid);if(!s||n<0||n>2)return;stage().choices[sid]=n;save();render();document.querySelector('.choice-box')?.scrollIntoView({block:'start',behavior:'instant'});}
function next(){const p=stage(),s=BOOK.scenes[active][p.at];if(!s||p.choices[s.id]===undefined)return;p.at=Math.min(6,p.at+1);save();render();window.scrollTo({top:0,behavior:'instant'});}
function prev(){stage().at=Math.max(0,stage().at-1);save();render();window.scrollTo({top:0,behavior:'instant'});}
function endingView(){const r=BOOK.routes[active],e=BOOK.endings[active];return `<div class="eyebrow">${esc(e.sub)}</div><div class="ending-ornament ${active}"><span>THE HOUSE OF WISDOM<br><small style="font-size:15px;letter-spacing:.1em">The first week is finished</small></span></div><h1 class="lead">${esc(e.title)}</h1><div class="prose">${paragraphs(e.body)}</div><div class="line"></div><div class="alert"><strong>Your story chapter is complete.</strong> Stop here. Week Two has not been written or unlocked in this build. Your choices, discovered clues and relationship consequences are saved locally.</div><div class="field"><label for="route-reflect">Your optional reflection</label><textarea id="route-reflect" class="input" placeholder="${esc(e.reflection)}" oninput="setWeek('${active}Reflection',this.value)">${esc(state.week[active+'Reflection']||'')}</textarea></div><p class="tiny">Sunday, October 4, is reserved for rest. You can return to your optional real-life journey when you choose; no tasks are required on Sunday.</p><div class="buttons"><button class="primary" onclick="go('week')">Open your real-life week →</button><button class="secondary" onclick="go('casebook')">Review your casebook</button><button class="secondary" onclick="stage().at=5;save();go('story')">Revisit the final scene</button></div>`;}
function casebook(){const p=stage(),scenes=BOOK.scenes[active],found=scenes.filter(s=>p.choices?.[s.id]!==undefined);let tall=stats();let named=[['RoseTrust','Rose'],['CatherineTrust','Catherine'],['ClaraConsent','Clara / family boundaries'],['WorkerTrust','Workshop staff'],['VivienneCooperation','Vivienne'],['DanielTrust','Daniel'],['JulianConfidence','Julian']];return `<div class="eyebrow">Personal casebook · ${esc(BOOK.routes[active].name)}</div><h1 class="lead">What you know<br>and what you chose.</h1><p class="subtitle">Observations are not verdicts. Your notebook grows as each scene is completed.</p><div class="buttons">${Object.keys(BOOK.routes).map(k=>`<button class="secondary" style="${active===k?'background:#dfd5c4':''}" onclick="active='${k}';render()">${esc(BOOK.routes[k].mark)} · ${esc(BOOK.routes[k].name)}</button>`).join('')}</div><h2 class="section-head">Evidence and unanswered questions</h2>${found.length?found.map(s=>`<div class="case-item"><h4>${esc(s.id)} · ${esc(s.title)}</h4>${s.evidence.map(e=>`<p>• ${esc(e)}</p>`).join('')}<div class="choice-history"><strong>Your choice:</strong> ${esc(s.choices[p.choices[s.id]].label)}<br><span style="color:#6a7469">A later consequence is attached to this decision; the main mystery cannot be made unsolvable.</span></div></div>`).join(''):'<p class="empty">No completed scenes yet. Your first clue appears after a decision.</p>'}<h2 class="section-head">Relationship patterns</h2><p class="tiny">These are narrative tendencies, not scores for moral worth.</p><div class="two-col">${named.map(([key,label])=>{let v=tall[key]||0;return `<div class="case-item"><strong>${esc(label)}</strong><div class="mobile-meta">${v>=3?'Growing confidence':v>0?'Opening up':v<0?'Strained or cautious':'Still unfolding'}</div></div>`}).join('')}</div><div class="buttons"><button class="primary" onclick="go('story')">Return to ${esc(BOOK.routes[active].name)}</button><button class="secondary" onclick="exportProgress()">Export progress</button></div>`;}
function setWeek(key,val){state.week[key]=String(val).slice(0,500);save();const badge=document.getElementById('save-msg');if(badge)badge.textContent=canStore?'Saved on this device':'Use Export to preserve your entries';}
function week(){let w=state.week;return `<div class="eyebrow">Week One Companion · Optional real-life reflection</div><h1 class="lead">Live the story<br>beyond the page.</h1><p class="subtitle">Planning, service, skill building, and the Three Envelopes—all chosen by you, without blocking story progress.</p><div class="alert">This is a light Week One companion, not a full 12-week planner. Sunday is a rest day. No spending, pledge, or activity is required to continue the adventure.</div><h2 class="section-head">Your priorities</h2><div class="field"><label for="priority">One priority you choose</label><textarea id="priority" placeholder="What matters most this week?" oninput="setWeek('priority',this.value)">${esc(w.priority)}</textarea></div><div class="field"><label for="service">A possible act of service (optional)</label><textarea id="service" placeholder="Something helpful you would like to do..." oninput="setWeek('service',this.value)">${esc(w.service)}</textarea></div><div class="field"><label for="skill">Your Skill Studio choice</label><input class="input" id="skill" value="${esc(w.skill)}" placeholder="Choose any real-world skill you want to develop" oninput="setWeek('skill',this.value)"></div><h2 class="section-head">The Three Envelopes</h2><p class="tiny">These are voluntary amounts to set aside if you wish. Zero or a blank field is always acceptable. No transactions occur in this app.</p><div class="envelope-grid"><div class="envelope"><label class="field-label" for="giving">Service & giving (£)</label><input class="input" id="giving" inputmode="decimal" placeholder="0.00" value="${esc(w.giving)}" oninput="setWeek('giving',this.value)"></div><div class="envelope"><label class="field-label" for="reward">Small personal rewards (£)</label><input class="input" id="reward" inputmode="decimal" placeholder="0.00" value="${esc(w.reward)}" oninput="setWeek('reward',this.value)"></div><div class="envelope"><label class="field-label" for="free">Free choice (£)</label><input class="input" id="free" inputmode="decimal" placeholder="0.00" value="${esc(w.free)}" oninput="setWeek('free',this.value)"></div></div><p class="save-indicator" id="save-msg" role="status">${canStore?'Saved locally as you type':'Saving is unavailable; export to keep a copy.'}</p><div class="line"></div><div class="quote">“Wisdom is not the absence of difficulty. It is the care we bring to what has been entrusted to us.”</div><div class="buttons"><button class="primary" onclick="go('story')">Return to your story</button><button class="secondary" onclick="exportProgress()">Export progress</button></div>`;}

function importProgress(input){const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result));if(!obj||typeof obj!=='object'||!obj.routes)throw Error('Not a House of Wisdom progress file');const restored=base();restored.name=typeof obj.name==='string'?obj.name.slice(0,50):'';for(const k of Object.keys(BOOK.routes)){const original=obj.routes[k];if(!original||typeof original!=='object')continue;const decisions={};for(const s of BOOK.scenes[k]){const v=original.choices?.[s.id];if(Number.isInteger(v)&&v>=0&&v<3)decisions[s.id]=v;}const at=Number.isInteger(original.at)?Math.max(0,Math.min(6,original.at)):0;restored.routes[k]={at,choices:decisions};}if(obj.week&&typeof obj.week==='object'){for(const key of Object.keys(restored.week)){if(typeof obj.week[key]==='string')restored.week[key]=obj.week[key].slice(0,500);}}state=restored;save();view='home';render();window.alert('Your Week One progress was imported.');}catch(err){window.alert('This file could not be imported as Week One progress.');}};reader.readAsText(f);}
function exportProgress(){const content=JSON.stringify({...state,exportedFrom:'The House of Wisdom Week One v1.4'},null,2);const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='house-of-wisdom-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function render(){let contents=view==='home'?home():view==='story'?sceneView():view==='casebook'?casebook():week();shell(contents);}
render();
